# Documentation-layout policy per repo: band, guides shelf, ratified exclusions.
# Band authored in agentic-os-kai. Procedure: the ratifying-an-exclusion doc.

repos:
  agent-compose:
    band: large
    guides: true
    excludes:
    - testdata/contracts/**
    - testdata/handmade-bundle/**
    - seed/roster/data/**
  agent-proxy:
    band: large
  agentic-os:
    band: large
    excludes:
    - SSM.md
  agentic-os-hardware:
    band: micro # its info lives primarily in skills
  agentic-os-kai:
    band: large
    excludes:
    - SSM.md
    - data/**
    - openclaw/**
    - mcp-servers/**
    - scripts/README.md
    - docs/FEATURES.md
    - evaluations/** # evaluation records, moved in from housecast
    - config/roster/data/** # overlay role bodies, which agent-compose loads from exactly this path
    size_excludes:
    - data/
    - evaluations/**
  agentic-os-xxx:
    band: micro # its info lives primarily in skills
  aterm-client:
    band: small
  coilysiren:
    band: micro # fundamentally a simple repo
  deploy:
    band: large
  eco-app:
    band: small
  eco-mods:
    band: small
    excludes:
    - mods/
    - unity/
    - unity-embedded/
  eco-ops:
    band: small
  enshrouded:
    band: small # Enshrouded server inputs and runbooks
  factorio-mods:
    band: micro
  factory-game-v3:
    band: small
  galaxy-gen:
    band: small
  housecast:
    band: small
    excludes:
    - evaluations/**
    size_excludes:
    - evaluations/**
  infrastructure:
    band: large
    excludes:
    - eco-server/
    - eco-server/**
  lore:
    band: micro # its info lives primarily in skills
  sentry-bridge:
    band: small # one small poller service
  sirens-echo:
    band: large
    excludes: # eval/<record>/ holds Sirens Deep evaluation records
    - eval/**
    size_excludes:
    - eval/**
  ssm-app:
    band: small # one small Swift app
  steam-ops:
    band: small
  tally:
    band: small
  umbra:
    band: large
    guides: true
    excludes: # evaluation records: evidence gating umbra features, one record per file
    - evaluations/**
    size_excludes:
    - evaluations/**
  voice-corpus:
    band: micro # its info lives primarily in skills
  website:
    band: large
    excludes:
    - drafts/**
    - src/pages/**
    - src/projects/**
    size_excludes:
    - drafts/
    - src/pages/
    - src/projects/
