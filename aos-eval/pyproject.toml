[build-system]
requires = ["setuptools>=68.1.2"]
build-backend = "setuptools.build_meta"

[project]
name = "aos-eval"
version = "0.1.1"
description = "Shared eval grading layer: schema, boundary pairing, human annotation, failure taxonomy, and a one-way display export."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Kai Ase Siren" }]
requires-python = ">=3.11"
# Deliberately no inspect-ai and no model client. The runners stay in the
# repos that own them, so this package never pulls inference into a consumer.
dependencies = [
    "click>=8.1",
    "pydantic>=2.9",
    "PyYAML>=6.0.3",
    "rich>=13",
]
keywords = [
    "coilysiren",
    "evaluation",
    "annotation",
    "grading",
    "agent",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://forgejo.coilysiren.me/coilyco-flight-deck/agentic-os"
Issues = "https://forgejo.coilysiren.me/coilyco-flight-deck/agentic-os/issues"

[project.scripts]
aos-eval = "aos_eval.cli:main"

[dependency-groups]
dev = ["pytest>=9"]

[tool.setuptools.packages.find]
include = ["aos_eval*"]

# PEP 561. Without the marker a strict-mypy consumer sees this package as
# untyped, which agent-compose hit on the first adoption.
[tool.setuptools.package-data]
aos_eval = ["py.typed"]

# Present so ruff resolves this directory as its own config root. Without it,
# a root-level `ruff check aos-eval` sorts `aos_eval` as third-party and
# disagrees with a run from inside the package.
[tool.ruff]
line-length = 100

[tool.ruff.lint.isort]
known-first-party = ["aos_eval"]
