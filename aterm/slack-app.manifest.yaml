# Manifest for the aterm adapter's own Slack app. Nothing reads it at runtime.
# See .agents/skills/tooling-aterm-client/references/slack-adapter.md for the steps.
display_information:
  name: aterm
  description: Kai's remote control for her agent seats.
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: aterm
    always_online: true
oauth_config:
  scopes:
    bot:
      - chat:write
      - im:history
      - reactions:write
settings:
  event_subscriptions:
    bot_events:
      - message.im
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
