# Hosted twin of the Forgejo gate, no container image. See docs/dev-container.md.
name: ci

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

env:
  UV_HTTP_TIMEOUT: "180"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aos-cli-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: aos-cli/go.mod
          cache-dependency-path: |
            aos-cli/go.sum
            aterm/go.sum
      - uses: ./actions/setup-ci
        with:
          tools: just
      - name: Test the AOS CLI
        run: just aos-test
      - name: Test the native terminal companion
        run: just aterm-test

  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: aos-cli/go.mod
      - uses: ./actions/setup-ci
        with:
          tools: just uv pre-commit trufflehog golangci-lint kdlfmt umbra
      - name: Cache uv downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-
      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Test the Python package and pre-commit hooks
        run: bash scripts/ci/repo-test-gate.sh
