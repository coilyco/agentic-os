# The gate on a hosted runner, no container image. See docs/dev-container.md.
name: ci

on:
  workflow_dispatch:
  workflow_call:
  pull_request:

permissions:
  contents: read

env:
  UV_HTTP_TIMEOUT: "180"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aos-cli-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: aos-cli/go.mod
          cache-dependency-path: |
            aos-cli/go.sum
            aterm/go.sum
      - uses: ./actions/setup-ci
        with:
          tools: just
      - name: Name the pinned agent-compose release
        id: acompose
        run: echo "tag=$(bash scripts/ci/install-agent-compose.sh tag)" >> "$GITHUB_OUTPUT"
      - name: Fetch the private agent-compose release
        uses: coilyco/.github/actions/fetch-release@f45ce248324c000f311419e5d39d96b16c57c266
        with:
          app_id: ${{ secrets.COILYCO_TREEHOUSE_READ_APP_ID }}
          private_key_base64: ${{ secrets.COILYCO_TREEHOUSE_READ_APP_PRIVATE_KEY_BASE64 }}
          tag: ${{ steps.acompose.outputs.tag }}
          assets: agent-compose-linux-amd64 agent-compose-roster.tar.gz
          dest: ${{ runner.temp }}/agent-compose-release
      - name: Install the pinned agent-compose for the roster guard
        env:
          AGENT_COMPOSE_BASE: ${{ runner.temp }}/agent-compose-release
        run: bash scripts/ci/install-agent-compose.sh
      - name: Test the AOS CLI
        run: just aos-test
      - name: Test the native terminal companion
        run: just aterm-test

  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: aos-cli/go.mod
      - uses: ./actions/setup-ci
        with:
          tools: just uv pre-commit trufflehog golangci-lint kdlfmt umbra
      - name: Cache uv downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-
      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Test the Python package and pre-commit hooks
        run: bash scripts/ci/repo-test-gate.sh
