# Gate the aterm web client only when its tree changes, so other changes pay nothing.
name: aterm-client

on:
  push:
    branches: [main]
    paths:
      - "aterm-client/**"
      - ".github/workflows/aterm-client.yml"
  pull_request:
    paths:
      - "aterm-client/**"
      - ".github/workflows/aterm-client.yml"

permissions:
  contents: read

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

concurrency:
  group: aterm-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: aterm-client/.node-version
      - uses: ./actions/setup-ci
        with:
          tools: just
      - run: just aterm-client-install
      - run: just aterm-client-gate
