# Build the heavy dev-base family only when the pull request changes Docker inputs.
name: dev-base-pr

on:
  pull_request:
    paths:
      - "docker/**"
      - "scripts/fs-shims/**"

permissions:
  contents: read

concurrency:
  group: dev-base-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - id: read-token
        uses: ./actions/dev-base-read-token
        with:
          app_id: ${{ secrets.COILYCO_TREEHOUSE_READ_APP_ID }}
          private_key_base64: ${{ secrets.COILYCO_TREEHOUSE_READ_APP_PRIVATE_KEY_BASE64 }}
      - name: Build and verify the complete dev-base family
        uses: ./actions/dev-base-build
        with:
          tag: pr-${{ github.run_id }}
          treehouse-read-token: ${{ steps.read-token.outputs.token }}
