# Build the aterm Android APK on each push, publish the stable build daily or on dispatch.
# Design: tooling-aterm-client references/android.md. Steps: scripts/ci/aterm-android*.sh.
name: aterm-android

on:
  push:
    branches: [main]
    paths:
      - "aterm-android/**"
      - "aterm-client/**"
      - "scripts/ci/aterm-android*.sh"
      - ".github/workflows/aterm-android.yml"
  pull_request:
    paths:
      - "aterm-android/**"
      - "scripts/ci/aterm-android*.sh"
      - ".github/workflows/aterm-android.yml"
  schedule:
    - cron: "23 9 * * *"
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump for the stable build."
        required: false
        default: "minor"
        type: choice
        options: [minor, patch]
      dry_run:
        description: "Build, sign, and verify, but publish nothing."
        required: false
        default: false
        type: boolean
      allow_throwaway:
        description: "Publish even when the signing secrets are unset. The APK will not install over a later properly signed build."
        required: false
        default: false
        type: boolean

concurrency:
  group: aterm-android-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.plan.outputs.build }}
      publish: ${{ steps.plan.outputs.publish }}
      previous_tag: ${{ steps.plan.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: bash "$GITHUB_WORKSPACE/scripts/ci/aterm-android-release.sh" plan

  apk:
    needs: plan
    if: ${{ needs.plan.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ATERM_ANDROID_KEYSTORE_B64: ${{ secrets.ATERM_ANDROID_KEYSTORE_B64 }}
      ATERM_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ATERM_ANDROID_KEYSTORE_PASSWORD }}
      ATERM_ANDROID_CERT_SHA256: ${{ secrets.ATERM_ANDROID_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Refuse to publish a throwaway-signed APK
        if: ${{ needs.plan.outputs.publish == 'true' && !inputs.allow_throwaway }}
        run: bash "$GITHUB_WORKSPACE/scripts/ci/aterm-android-guard.sh"

      - id: tag
        uses: ./actions/tag-bump
        with:
          bump: ${{ github.event.inputs.bump || 'minor' }}
          tag_prefix: aterm-android-v
          create_tag: "false"
          release_sha: ${{ github.sha }}

      - id: code
        run: echo "code=$(bash "$GITHUB_WORKSPACE/scripts/ci/aterm-android.sh" version-code)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version-file: aterm-client/.node-version
      - uses: ./actions/setup-ci
        with:
          tools: just

      - name: Install the Android toolchain
        run: mkdir -p "$GITHUB_WORKSPACE/aterm-android-out" && bash "$GITHUB_WORKSPACE/scripts/ci/aterm-android.sh" toolchain

      - name: Build the unsigned APK
        env:
          VERSION: ${{ steps.tag.outputs.new_version }}
          ATERM_ANDROID_VERSION_CODE: ${{ steps.code.outputs.code }}
        run: bash "$GITHUB_WORKSPACE/scripts/ci/aterm-android.sh" build "$VERSION" "$GITHUB_WORKSPACE/aterm-android-out/aterm-unsigned.apk"

      - name: Sign the APK
        run: bash "$GITHUB_WORKSPACE/scripts/ci/aterm-android.sh" sign "$GITHUB_WORKSPACE/aterm-android-out/aterm-unsigned.apk" "$GITHUB_WORKSPACE/aterm-android-out/aterm.apk"

      - name: Verify the signature
        run: bash "$GITHUB_WORKSPACE/scripts/ci/aterm-android.sh" verify "$GITHUB_WORKSPACE/aterm-android-out/aterm.apk"

      - name: Keep the build as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: aterm-android-${{ steps.tag.outputs.new_version }}-${{ steps.code.outputs.code }}
          path: ${{ github.workspace }}/aterm-android-out/aterm.apk
          retention-days: 14

      - name: Write the release notes
        if: ${{ needs.plan.outputs.publish == 'true' }}
        env:
          PREVIOUS_TAG: ${{ needs.plan.outputs.previous_tag }}
          VERSION: ${{ steps.tag.outputs.new_version }}
          CODE: ${{ steps.code.outputs.code }}
        run: bash "$GITHUB_WORKSPACE/scripts/ci/aterm-android-release.sh" notes "$PREVIOUS_TAG" "$VERSION" "$CODE" "$GITHUB_SHA" > "$GITHUB_WORKSPACE/aterm-android-out/notes.md"

      - name: Publish the stable release and the fixed link
        if: ${{ needs.plan.outputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.new_tag }}
        run: bash "$GITHUB_WORKSPACE/scripts/ci/aterm-android-release.sh" publish "$TAG" "$GITHUB_WORKSPACE/aterm-android-out/aterm.apk" "$GITHUB_WORKSPACE/aterm-android-out/notes.md" "$GITHUB_SHA"
