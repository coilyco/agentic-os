<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="__GROUND__" />
    <!-- use-credentials: a manifest request omits cookies otherwise, and a gated host redirects it to sign-in. -->
    <link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <title>Treehouse</title>
    <!-- The theme before the first paint, so a light page never flashes dark. lib/theme.ts owns it. -->
    <script>
      try {
        var t = localStorage.getItem("aterm.theme.v1");
        var light = t === "light" || (t !== "dark" && matchMedia("(prefers-color-scheme: light)").matches);
        document.documentElement.dataset.theme = light ? "light" : "dark";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
