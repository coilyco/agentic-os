# CI runs in the dev-base image agents use, per the agentic-os CI-in-dev-base convention.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: docker
    timeout-minutes: 20
    container: forgejo.coilysiren.me/coilyco/agentic-os:release
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: just install
      - run: just gate
