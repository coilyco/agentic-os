[build-system]
requires = ["setuptools>=68.1.2"]
build-backend = "setuptools.build_meta"

[project]
name = "aos-precommit"
version = "0.1.0"
description = "AOS cross-repo pre-commit hooks for skill catalogs, documentation, code comments, links, and composed role sources."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Kai Siren" }]
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0.3",
    "ruamel.yaml>=0.19",
    "tomli>=2.4; python_version < '3.11'",
]
keywords = [
    "coilysiren",
    "pre-commit",
    "skill-discipline",
    "catalog",
    "validator",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/coilyco-flight-deck/agentic-os"
Issues = "https://github.com/coilyco-flight-deck/agentic-os/issues"

[project.scripts]
check-agent-compose-size = "agentic_os.pre_commit.check_agent_compose_size:main"
check-agent-compose-dedup = "agentic_os.pre_commit.check_agent_compose_dedup:main"
check-skills = "agentic_os.pre_commit.check_skill:main"
check-composed-skills = "agentic_os.pre_commit.check_composed_skills:main"
check-dead-links = "agentic_os.pre_commit.check_dead_links:main"
check-catalog-doc-size = "agentic_os.pre_commit.check_catalog_doc_size:main"
check-catalog-trifecta = "agentic_os.pre_commit.check_catalog_trifecta:main"
check-code-review-contract = "agentic_os.pre_commit.check_code_review_contract:main"
check-code-comments = "agentic_os.pre_commit.check_code_comments:main"
check-actions-run-one-line = "agentic_os.pre_commit.check_actions_run_one_line:main"
check-source-doc-refs = "agentic_os.pre_commit.check_source_doc_refs:main"
check-documentation-layout = "agentic_os.pre_commit.check_documentation_layout:main"
check-context-load-points = "agentic_os.pre_commit.check_context_load_points:main"
check-context-budget = "agentic_os.pre_commit.check_context_budget:main"
agents-context-inventory = "agentic_os.agents_context_inventory:main"
check-aws-config = "agentic_os.pre_commit.check_aws_config:main"
check-ssm-path = "agentic_os.pre_commit.check_ssm_path:main"
check-yaml-strict = "agentic_os.pre_commit.check_yaml_strict:main"
check-repo-pointer-skills = "agentic_os.pre_commit.check_repo_pointer_skills:main"
check-agents-pointer = "agentic_os.pre_commit.check_agents_pointer:main"
check-git-workflow = "agentic_os.pre_commit.check_git_workflow:main"
check-misplaced-skills = "agentic_os.pre_commit.check_misplaced_skills:main"
check-seed-skills = "agentic_os.pre_commit.check_seed_skills:main"
check-seed-skills-drift = "agentic_os.pre_commit.check_seed_skills_drift:main"
check-caps-reference-drift = "agentic_os.pre_commit.check_caps_reference_drift:main"
check-leak-guard = "agentic_os.pre_commit.check_leak_guard:main"
check-unresolved-placeholders = "agentic_os.pre_commit.check_unresolved_placeholders:main"
check-issue-references = "agentic_os.pre_commit.check_issue_references:main"
leak-guard-encode = "agentic_os.pre_commit.encode_leak_term:main"
agent-id = "agentic_os.agent_id:main"
prod-install-ref = "agentic_os.prod_install_ref:main"

generate-agents-pointer = "agentic_os.generators.generate_agents_pointer:main"
generate-git-workflow = "agentic_os.generators.generate_git_workflow:main"
generate-repo-pointer-skill = "agentic_os.generators.generate_repo_pointer_skill:main"
generate-seed-skills = "agentic_os.generators.generate_seed_skills:main"
generate-caps-reference = "agentic_os.generators.generate_caps_reference:main"

# Self-compliance config for the hooks this repo ships. See docs/release.md.
[tool.agentic-os.documentation-layout]
band = "large"
# AGENTS.md here is the canonical operating-doctrine base, always composed into
# every session, so the cap is deliberate back-pressure rather than headroom.
# Lowered from 320/34000 once role-scoped doctrine moved out to the
# agent-compose role melds that own it, leaving only what binds every session
# regardless of role. The margin over the current file is one section, not five.
# Anything that binds one role belongs in that role's source, so the next entry
# here should displace one rather than extend the file. Raise these numbers only
# with a reason that survives that test.
# Raised 290 to 296 for "A pushed branch owes its pull request", which binds
# every session and every role, so no role source can hold it. Branches were
# left unreviewed daily for a week while the rule sat only in a git-workflow
# skill nobody loads by default.
# Raised 296 to 300 for "Serialized checkouts invert isolation", which carves a
# named set of repositories out of the three isolation rules directly above it.
# It cannot displace one of them or move to a role source: an agent has to know
# not to shadow before it takes its first action, and every role source and skill
# fires conditionally. The exemption is host-scoped rather than role-scoped, so
# no role meld is the right owner. The set itself stays in docs, not here.
# Raised 300 to 319 for the generated git-workflow block, which replaces the
# one-line lane stamp it used to carry. The stamp named the lane without ever
# saying the lane is a standing authorization, so agents kept stopping to ask
# before a commit, a branch, a push, or a pull request and ended turns with the
# work stranded in a dirty worktree. It cannot move to a role source: an agent
# needs the authorization before its first action, and every role source fires
# conditionally. It cannot be reworded per-repo either, since the generator
# owns every byte. The block also spells out that a lane slug names what the
# AGENT does: `pull-request-and-merge` means the author merges its own PR, and
# `pull-request` is the lane that stops for the director merge lane instead.
agents_md_max_lines = 319
# The +400 over 26000 carries the byte-identical PR-lane git-workflow stamp
# shared with deploy, infrastructure, sirens-echo, and ward (agentic-os#994).
# Same parity argument as the engineer/QA live-deploy block: it cannot be
# reworded or split per-repo without breaking the five-repo match.
# Raised 27400 to 28200 alongside the line cap, for the same carve-out and the
# same reason. The margin over the current file stays one section, not five.
agents_md_max_chars = 30340
# Subsystem dirs carry idiomatic co-located READMEs and config docs that the
# root/docs/skills location rule does not model. Excluded per the root layout
# hatch: warp (Go module).
excludes = [
    "warp/launch_configurations/**",
    "warp/tab_configs/**",
    # Root SSM.md is a focused pointer to the SSM params aos code consumes,
    # mirroring the canonical SSM.md placement. See SSM.md.
    "SSM.md",
]

# code-comments extended to YAML, then tightened to one top-of-file comment
# since a key-sorter drifts any lower comment off its target,
# then relaxed to allow a contiguous comment block above the first content
# line (the whole header stays put under a sort).
# These pre-existing files carry rich teaching/config comment blocks
# (skill-discipline examples, the skills registry, warp configs) and are
# grandfathered so the rule enforces net-new YAML.
# Cleanup tracked in the code-comments docs. Bash comments inside `run: |`
# block scalars are no longer over-read, so actions/** needs no exclude.
[tool.agentic-os.code-comments]
excludes = [
    ".agents/skills/categories.yaml",
    ".agents/composed/tooling-issue-prioritization/references/p0-content-rules.yaml",
    ".pre-commit-config.yaml",
    ".pre-commit-hooks.yaml",
    "docs/skill-discipline-example-categories.yaml",
    "docs/skill-discipline-example-pre-commit-config.yaml",
    "docs/ci-in-dev-base-example.yml",
    "warp/launch_configurations/**",
]

[tool.agentic-os.repo-pointer-skills]
# This repo migrated from the coilysiren org to coilyco-flight-deck, so its
# repo-pointer skills point at ~/projects/coilyco-flight-deck/.
org = "coilyco-flight-deck"

[tool.agentic-os.issue-reference-guard]
enabled = true
excludes = ["agentic_os.egg-info/**", "aos_precommit.egg-info/**"]

[dependency-groups]
dev = ["pytest>=9"]

# aos-eval is a separate project with its own environment, so its tests are not
# importable from here. `just aos-eval-test` runs them.
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["agentic_os*"]

[tool.setuptools.package-data]
# Ship JSON contracts so an importing consumer, not just a source checkout,
# can read them.
agentic_os = [
    "agent_id_vectors.json",
    "org_shortnames.json",
]
