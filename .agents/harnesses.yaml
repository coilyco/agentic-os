# Public agent and harness capability registry. Owner: coilyco-flight-deck/agentic-os.
max_options_per_intent: 4
role_eligibility:
  community:
    allowed_harnesses: [sirens-echo]
harnesses:
  aider:
    description: >-
      Aider is a git-native terminal pair programmer that focuses on deliberate
      edits and reviewable commits. Choose it for an interactive coding or review
      loop with explicit diffs, repository context, and a human close enough to
      steer each change.
    url: "https://github.com/Aider-AI/aider"
    intents: [code-review, interactive-coding]
  aosx:
    description: >-
      AOSX is the private generative-image harness that owns prompt graphs,
      reference media, and output handling around its image-workflow backend.
      Choose it for producing or revising image artifacts while keeping runtime
      details below the picker boundary.
    url: "https://forgejo.coilysiren.me/coilyco-bridge/agentic-os-xxx"
    intents: [design-production]
  anythingllm:
    description: >-
      AnythingLLM is a local-first workspace for document retrieval, research, and
      agent-assisted synthesis. Choose it when the work starts from a body of
      supplied knowledge and benefits from persistent workspaces, citations, or
      exploratory product framing.
    url: "https://github.com/Mintplex-Labs/anything-llm"
    intents: [research-synthesis, knowledge-retrieval, product-shaping]
  botkube:
    description: >-
      Botkube brings Kubernetes alerts and operational commands into team chat
      surfaces. Choose it when an investigation starts from live cluster events and
      responders need a collaborative ChatOps interface instead of a standalone
      diagnostic CLI.
    url: "https://github.com/kubeshop/botkube"
    intents: [ops-investigation]
  cline:
    description: >-
      Cline is an interactive plan-and-act coding agent with deep editor, tool, and
      MCP integration. Choose it when a human will actively supervise
      implementation and wants the agent to inspect context, propose actions, and
      execute changes from the development environment.
    url: "https://github.com/cline/cline"
    intents: [interactive-coding]
  continue:
    description: >-
      Continue turns source-controlled review instructions into automated
      pull-request checks and suggested fixes. Choose it when QA criteria should
      live with the repository and run consistently against each proposed change
      instead of depending on an ad hoc conversational review.
    url: "https://github.com/continuedev/continue"
    intents: [code-review]
  elizaos:
    description: >-
      ElizaOS is an extensible agent runtime with connectors for social channels.
      Choose it when publishing or sales conversations span several external
      platforms and need a programmable, persistent agent behind those channel
      integrations.
    url: "https://github.com/elizaOS/eliza"
    intents: [channel-publishing, conversation-management]
  factory-worker:
    description: >-
      The factory-worker is AOSH's bounded, black-box helper for deciding workload
      residency and fleet placement from supplied operational state. Choose it only
      for the narrow one-context-in, one-decision-out lane, where the caller needs a
      fast unattended routing decision instead of an investigative loop.
    url: "https://forgejo.coilysiren.me/coilyco-bridge/agentic-os-hardware/src/branch/main/.agents/skills/leaderboard-mistral-geo/SKILL.md"
    intents: [operational-decision]
  goose:
    description: >-
      Goose is a local general-purpose agent with a mature tool loop, extension
      system, and support for unattended execution. Choose it when the task needs
      reliable autonomous implementation or a bounded operational decision in a
      flexible, tool-rich runtime.
    url: "https://github.com/aaif-goose/goose"
    intents: [operational-decision, autonomous-coding]
  gptme:
    description: >-
      gptme is a local-first terminal agent with persistent conversations,
      repository tools, and a programmable execution loop. Choose it for
      long-running autonomous work, fuzzy planning, or early product shaping when
      continuity across many steps matters more than a specialized interface.
    url: "https://github.com/gptme/gptme"
    intents: [strategic-planning, product-shaping, autonomous-coding]
  hermes:
    description: >-
      Hermes Agent is a persistent reasoning and tool agent with memory, scheduled
      work, messaging gateways, and knowledge-work support. Choose it for strategic
      planning, research synthesis, or operational investigation that benefits from
      carrying context across sessions and coordinating several tools.
    url: "https://github.com/NousResearch/hermes-agent"
    intents: [strategic-planning, research-synthesis, ops-investigation]
  holmesgpt:
    description: >-
      HolmesGPT is a production-investigation agent built to correlate
      infrastructure evidence and explain root causes. Choose it when responders
      need an SRE-focused investigation across Kubernetes, observability, cloud, or
      database sources instead of a general chat or coding surface.
    url: "https://github.com/HolmesGPT/holmesgpt"
    intents: [ops-investigation]
  k8sgpt:
    description: >-
      K8sGPT scans Kubernetes resources with deterministic analyzers and can enrich
      findings with a generated explanation. Choose it for a fast cluster health
      pass or triage workflow where Kubernetes-specific checks should narrow the
      evidence before deeper investigation.
    url: "https://github.com/k8sgpt-ai/k8sgpt"
    intents: [ops-investigation]
  khoj:
    description: >-
      Khoj is a self-hostable research assistant over personal documents, notes,
      and web sources. Choose it when an agent needs durable retrieval, scheduled
      research, or synthesis grounded in a private knowledge corpus instead of a
      one-off prompt.
    url: "https://github.com/khoj-ai/khoj"
    intents: [research-synthesis, knowledge-retrieval]
  leantime:
    description: >-
      Leantime is a self-hosted project hub that connects goals, projects, tasks,
      schedules, and time tracking. Choose it for autonomous coordination when the
      team wants project state in a human-readable system, with agent access
      supplied by its MCP integration.
    url: "https://docs.leantime.io/installation/leantime-mcp"
    intents: [project-coordination]
  mixpost:
    description: >-
      Mixpost is a self-hosted social-media workspace for composing, scheduling,
      and publishing channel content. Choose it when a human or agent needs a
      calendar-centered path from draft to multi-channel delivery, with a free Lite
      edition and paid feature upgrades available.
    url: "https://github.com/inovector/mixpost"
    intents: [message-composition, channel-publishing]
  ollama-ocr:
    description: >-
      Ollama OCR is AOSH's local image and PDF text-extraction surface backed by a
      measured vision runtime. Choose it when the intent is faithful transcription
      or document reading and the workflow should stay local, narrow, and separate
      from general-purpose multimodal chat.
    url: "https://forgejo.coilysiren.me/coilyco-bridge/agentic-os-hardware/src/branch/main/scripts/vision-bench.py"
    intents: [vision-ocr]
  opencode:
    description: >-
      OpenCode is an open-source coding agent designed for an interactive terminal
      or desktop loop with a human driving. Choose it for implementation or review
      when the operator wants project instructions, broad tool support, and a
      responsive session instead of unattended dispatch.
    url: "https://github.com/anomalyco/opencode"
    intents: [interactive-coding, code-review]
  openhands:
    description: >-
      OpenHands is an autonomous software-engineering platform with isolated
      runtimes, repository tools, and long-horizon task execution. Choose it when an
      engineer lane must work without turn-by-turn supervision and the task needs a
      purpose-built autonomous coding environment.
    url: "https://github.com/OpenHands/OpenHands"
    intents: [autonomous-coding]
  openwebui:
    description: >-
      Open WebUI is a self-hosted front end for chat, retrieval, document work, and
      multimodal interaction. Choose it when the operator needs a general workspace
      for grounded knowledge answers, message drafting, or visual document
      inspection instead of a specialized single-purpose harness.
    url: "https://github.com/open-webui/open-webui"
    intents: [knowledge-retrieval, message-composition, vision-ocr]
  penpot:
    description: >-
      Penpot is an open-source design platform with an MCP server that lets agents
      inspect and modify design files, components, tokens, and layouts. Choose it
      when product shaping or design production must remain attached to editable
      design-system artifacts instead of ending as prose or generated pixels.
    url: "https://help.penpot.app/mcp/"
    intents: [product-shaping, design-production]
  pi:
    description: >-
      Pi is a minimal, extensible terminal agent toolkit with a small core and
      programmable interfaces. Choose it for strategic planning when the operator
      values a transparent, adaptable reasoning surface and wants to assemble only
      the tools required for the planning session.
    url: "https://github.com/badlogic/pi-mono"
    intents: [strategic-planning]
  plandex:
    description: >-
      Plandex is a terminal agent built around planning and executing large,
      multi-step changes across many files. Choose it when strategic planning
      should hand directly into an unattended implementation plan that remains
      structured over a long context and several execution stages.
    url: "https://github.com/plandex-ai/plandex"
    intents: [strategic-planning, autonomous-coding]
  plane:
    description: >-
      Plane is an open-source project system for work items, cycles, modules,
      initiatives, and team coordination. Choose it when an agent needs a broad,
      first-party MCP surface for reading and updating structured project state
      while people continue working from the same project interface.
    url: "https://github.com/makeplane/plane-mcp-server"
    intents: [project-coordination]
  qwen-code:
    description: >-
      Qwen Code is an open-source terminal coding agent with rich tools, subagents,
      skills, and support for several API protocols. Choose it for an interactive
      coding session when the operator wants a full agentic workflow that remains
      portable across inference backends.
    url: "https://github.com/QwenLM/qwen-code"
    intents: [interactive-coding]
  rasa:
    description: >-
      Rasa is a conversational-assistant runtime for structured dialogue, business
      logic, retrieval, and human handoff. Choose it when customer or sales
      conversations need explicit flows and predictable state management instead
      of only free-form generation.
    url: "https://rasa.com/docs/"
    intents: [conversation-management, knowledge-retrieval]
  sirens-echo:
    description: >-
      Sirens Echo is the exclusive Community harness for the Sirens Discord.
      It owns Discord invocation and delivery, Community context, tool use,
      structured responses, evaluation, and observability while keeping inference
      behind a model-opaque logical route.
    url: "https://forgejo.coilysiren.me/coilyco-gaming/sirens-echo"
    intents: [knowledge-retrieval, conversation-management]
    roles: [community]
  vtcode:
    description: >-
      VTCode is a Rust coding agent with semantic code context, native sandboxing,
      audit logs, and a dedicated review command. Choose it for code review when
      the operator wants a security-conscious terminal surface that can inspect
      repository structure and produce a focused verdict.
    url: "https://github.com/vinhnx/VTCode"
    intents: [code-review]
