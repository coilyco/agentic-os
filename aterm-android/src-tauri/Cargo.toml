[package]
name = "aterm-app"
version = "0.1.0"
description = "The aterm client as an Android app: a Tauri 2 shell around aterm-client's built bundle."
authors = ["coilyco"]
license = "MIT"
repository = "https://github.com/coilyco/agentic-os"
edition = "2024"
rust-version = "1.90"

[lib]
name = "aterm_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

# The page talks to the daemon over its own websocket, so the one plugin is the device
# key and no app IPC commands exist. See .agents/skills/tooling-aterm-client/references/android.md.
[dependencies]
tauri = { version = "=2.12.1", features = [] }
tauri-plugin-devicekey = { path = "../plugins/tauri-plugin-devicekey" }

# The desktop shell reads the daemon's roster. Both are already in the tree through tauri.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
