[package]
name = "tauri-plugin-dictation"
version = "0.1.0"
description = "The phone's own speech recognition as a way to dictate into the aterm app's composer."
authors = ["coilyco"]
license = "MIT"
repository = "https://github.com/coilyco/agentic-os"
edition = "2024"
rust-version = "1.90"
links = "tauri-plugin-dictation"

[dependencies]
tauri = "=2.12.1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "=2.7.1", features = ["build"] }

[dev-dependencies]
serde_json = "1"
