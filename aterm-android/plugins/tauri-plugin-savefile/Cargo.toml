[package]
name = "tauri-plugin-savefile"
version = "0.1.0"
description = "Saves a file the aterm page holds into the device's Downloads folder, since a Tauri WebView drops a blob download."
authors = ["coilyco"]
license = "MIT"
repository = "https://github.com/coilyco/agentic-os"
edition = "2024"
rust-version = "1.90"
links = "tauri-plugin-savefile"

[dependencies]
tauri = "=2.12.1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
base64 = "0.22"

[build-dependencies]
tauri-plugin = { version = "=2.7.1", features = ["build"] }

[dev-dependencies]
serde_json = "1"
tauri = { version = "=2.12.1", features = ["test"] }
