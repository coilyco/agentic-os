[package]
name = "tauri-plugin-devicekey"
version = "0.1.0"
description = "An Android Keystore signing key behind BiometricPrompt, for the aterm app to prove it is Kai's phone."
authors = ["coilyco"]
license = "MIT"
repository = "https://github.com/coilyco/agentic-os"
edition = "2024"
rust-version = "1.90"
links = "tauri-plugin-devicekey"

[dependencies]
tauri = "=2.12.1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "=2.7.1", features = ["build"] }

[dev-dependencies]
serde_json = "1"
