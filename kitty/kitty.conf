# Portable Sombra baseline for aterm-launched agent sessions.
#
# A host-local root config includes this and adds only its shell and startup
# directory. aterm overrides the per-role brand at launch with -o, so the
# background, cursor, and selection colors here are the unbranded defaults a
# plain kitty gets. The ANSI palette is deliberately not overridden per role,
# because harness TUIs use those colors semantically.

font_size 14.5
window_padding_width 8
background_opacity 1.0
confirm_os_window_close 0

# Copy-only clipboard policy. Omitting every read-* capability denies OSC 52
# reads while leaving writes working, matching the Alacritty `osc52 = OnlyCopy`
# stance this file replaces.
clipboard_control write-clipboard write-primary

foreground #fafbff
background #0d0a1c

cursor #ff5ec4
cursor_text_color #0d0a1c

selection_foreground #0d0a1c
selection_background #ff5ec4

# normal
color0 #0d0a1c
color1 #ff5a7a
color2 #5fe69f
color3 #ffd866
color4 #7aa8d8
color5 #ff5ec4
color6 #1fd6e8
color7 #fafbff

# bright
color8  #6a5f9a
color9  #ff8aa2
color10 #8af0bd
color11 #ffe399
color12 #a8b8e0
color13 #ff95da
color14 #6ae4f0
color15 #ffffff

# One window is one agent session, so there is no tab surface to navigate.
# Hiding the bar is not enough on its own: the shortcuts still exist and would
# silently split a session's window, so each one is unmapped rather than left
# to a hidden bar.
tab_bar_style hidden
map cmd+t new_os_window
map cmd+shift+] no_op
map cmd+shift+[ no_op
map ctrl+shift+right no_op
map ctrl+shift+left no_op
map cmd+1 no_op
map cmd+2 no_op
map cmd+3 no_op
map cmd+4 no_op
map cmd+5 no_op
map cmd+6 no_op
map cmd+7 no_op
map cmd+8 no_op
map cmd+9 no_op
map cmd+enter no_op
map ctrl+shift+enter no_op

# Harnesses read a bare Return as submit, so Shift+Return has to arrive as an
# escaped newline rather than a second submit.
map shift+enter send_text all \x1b\r

# `aterm pane` talks to this window over a socket (aterm/pane.go preflight).
# kitty appends the window's pid to the path, so sessions do not collide.
allow_remote_control socket-only
listen_on unix:/tmp/kitty

# Plain macOS editing keys. Left Option acts as Alt so readline and harness
# prompts get word motion, and right Option keeps typing accented characters.
# Each map sends the same bytes a readline binding expects, so it holds in zsh,
# bash, and the harness input boxes alike.
macos_option_as_alt left
map opt+left send_text all \x1bb
map opt+right send_text all \x1bf
map cmd+left send_text all \x01
map cmd+right send_text all \x05
map cmd+backspace send_text all \x15

# Scrollback is the trackpad or wheel, and cmd+up/down and cmd+home/end move
# it. Search opens the scrollback in micro, read-only, with its find prompt
# already up: arrows and the wheel move, ctrl+f searches, ctrl+q leaves. kitty's
# stock cmd+f, ctrl+shift+h and ctrl+shift+/ hand the scrollback to `less`,
# whose keys are vi-style (j, k, /, q), so those three are replaced and
# ctrl+shift+g, which also opens `less`, is unmapped.
map cmd+f combine : launch --type=overlay --stdin-source=@screen_scrollback micro -readonly true -softwrap true : send_key ctrl+end ctrl+f
map kitty_mod+/ combine : launch --type=overlay --stdin-source=@screen_scrollback micro -readonly true -softwrap true : send_key ctrl+end ctrl+f
map kitty_mod+h combine : launch --type=overlay --stdin-source=@screen_scrollback micro -readonly true -softwrap true : send_key ctrl+end
map kitty_mod+g no_op
