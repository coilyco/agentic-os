# Example .pre-commit-config.yaml entry.
#
# These hooks ship from the aos-precommit Python distribution through the managed
# coilyco-flight-deck/agentic-os pre-commit block.

repos:
  - repo: https://forgejo.coilysiren.me/coilyco-flight-deck/agentic-os
    rev: aos-precommit-v0.1.0
    hooks:
      - id: check-skills
      - id: check-composed-skills
      - id: dead-cross-links
      - id: source-doc-refs
      - id: documentation-layout
      - id: code-comments
