# Reference CI workflow: run an app's gate INSIDE the moving :release dev-base image,
# through the same `just` verbs a dispatched agent runs, so a green CI
# means "a headless agent can land this." See docs/ci-in-dev-base.md.
#
# Copy this into an app's .forgejo/workflows/ci.yml. Keep the promoted :release
# alias so the gate follows the same full image as the AOS launcher.
#
# This is a documentation reference copy owned by aos, not a live workflow -
# aos ships the convention, each app ships the rollout unit (agentic-os#328).

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: docker
    # Moving release image: the same promoted full image agents run in.
    container: forgejo.coilysiren.me/coilyco/agentic-os:release
    steps:
      - uses: actions/checkout@v6

      # The app's own gate verbs, defined in its justfile - identical to what a
      # headless agent run executes. No hand-rolled uv/pip steps.
      - run: just lint
      - run: just test
      - run: just smoke
