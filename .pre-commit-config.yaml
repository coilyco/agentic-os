repos:
  - repo: local
    hooks:
      - id: catalog-block-present
        name: .ward/ward.yaml catalog block present
        entry: python -m agentic_os.pre_commit.check_catalog_block
        language: python
        additional_dependencies: [pyyaml]
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
      - id: check-skills
        name: skill conventions
        entry: python -m agentic_os.pre_commit.check_skill
        language: python
        additional_dependencies: [pyyaml]
        pass_filenames: false
        files: '^\.agents/skills/'
        stages: [pre-commit]
      - id: check-composed-skills
        name: composed skill conventions
        entry: python -m agentic_os.pre_commit.check_composed_skills
        language: python
        additional_dependencies: [pyyaml]
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: documentation-layout
        name: documentation layout
        entry: python -m agentic_os.pre_commit.check_documentation_layout
        language: python
        additional_dependencies: [pyyaml]
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
      - id: catalog-trifecta
        name: catalog-trifecta cross-link convention
        entry: python -m agentic_os.pre_commit.check_catalog_trifecta
        language: python
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
      - id: code-review-contract
        name: code review contract
        entry: python -m agentic_os.pre_commit.check_code_review_contract
        language: python
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
      - id: context-load-points
        name: agent context load-points
        entry: python -m agentic_os.pre_commit.check_context_load_points
        language: python
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
      - id: code-comments
        name: code comment discipline
        entry: python -m agentic_os.pre_commit.check_code_comments
        language: python
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: actions-run-one-line
        name: Actions run steps stay one line
        entry: python -m agentic_os.pre_commit.check_actions_run_one_line
        language: python
        additional_dependencies: [pyyaml]
        always_run: true
        pass_filenames: false
        files: '(^|/)(\.github/workflows/.*\.ya?ml|\.forgejo/workflows/.*\.ya?ml|action\.ya?ml)$'
        stages: [pre-commit]
      - id: source-doc-refs
        name: source doc references
        entry: python -m agentic_os.pre_commit.check_source_doc_refs
        language: python
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: dead-cross-links
        name: dead cross-links
        entry: python -m agentic_os.pre_commit.check_dead_links
        language: python
        additional_dependencies: [pyyaml]
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
      - id: repo-pointer-skills
        name: repo-pointer skills auto-generated
        entry: python -m agentic_os.pre_commit.check_repo_pointer_skills
        language: python
        additional_dependencies: [pyyaml]
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
      - id: misplaced-skills
        name: no foreign repo-specific skills
        entry: python -m agentic_os.pre_commit.check_misplaced_skills
        language: python
        additional_dependencies: [pyyaml]
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
      - id: leak-guard
        name: encoded leak guard
        entry: python -m agentic_os.pre_commit.check_leak_guard
        language: python
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
      - id: seed-skills-drift
        name: seed_skills_data.py in sync with skill frontmatter
        entry: python -m agentic_os.pre_commit.check_seed_skills_drift
        language: python
        additional_dependencies: [pyyaml]
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
      - id: caps-reference-drift
        name: catalog-caps-reference.md in sync with validator constants
        entry: python -m agentic_os.pre_commit.check_caps_reference_drift
        language: python
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
      - id: local-model-roster
        name: AOS local models match the AOSH provisioned roster
        entry: python -m agentic_os.local_model_sync --check --if-present
        language: python
        additional_dependencies: [pyyaml]
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
      - id: role-harness-board
        name: AOS role-intent harness defaults match AOSH
        entry: python -m agentic_os.harness_board_sync --check --if-present
        language: python
        additional_dependencies: [pyyaml]
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
      - id: agent-compose-size
        name: agent-compose source size budget
        entry: python -m agentic_os.pre_commit.check_agent_compose_size
        language: python
        additional_dependencies: [pyyaml]
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
      - id: agent-compose-dedup
        name: agent-compose dedup
        entry: python -m agentic_os.pre_commit.check_agent_compose_dedup
        language: python
        additional_dependencies: [pyyaml]
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
      - id: warp-go-vet
        name: vet the ward exec warp module
        entry: bash -c 'cd warp && go vet -p 1 ./...'
        language: system
        files: ^warp/.*\.go$
        pass_filenames: false
        stages: [pre-commit]
      - id: warp-gofmt
        name: gofmt the ward exec warp module
        entry: bash -c 'cd warp && gofmt -w .'
        language: system
        files: ^warp/.*\.go$
        pass_filenames: false
        stages: [pre-commit]
      - id: aos-say-go-vet
        name: vet the aos-say module
        entry: bash -c 'cd aos-say && go vet -p 1 ./...'
        language: system
        files: ^aos-say/.*\.go$
        pass_filenames: false
        stages: [pre-commit]
      - id: aos-say-gofmt
        name: gofmt the aos-say module
        entry: bash -c 'cd aos-say && gofmt -w .'
        language: system
        files: ^aos-say/.*\.go$
        pass_filenames: false
        stages: [pre-commit]
      - id: unresolved-placeholder-guard
        name: unresolved placeholder guard
        entry: python -m agentic_os.pre_commit.check_unresolved_placeholders
        language: python
        always_run: true
        pass_filenames: false
        stages: [manual]
      - id: issue-reference-guard
        name: issue reference guard
        entry: python -m agentic_os.pre_commit.check_issue_references
        language: python
        always_run: true
        pass_filenames: false
        stages: [manual]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: check-merge-conflict
        args: [--assume-in-merge]
      - id: check-case-conflict
      - id: check-illegal-windows-names
      - id: mixed-line-ending
      - id: check-json
      - id: check-toml
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      # Forgejo workflows use GitHub Actions syntax; no exclude split is needed yet.
      - id: actionlint
        args:
          - -config-file
          - .github/actionlint.yaml
        files: ^\.forgejo/workflows/.*\.(ya?ml)$
  - repo: https://code.forgejo.org/forgejo/runner
    rev: v12.10.1
    hooks:
      - id: forgejo-runner-validate
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        exclude: ^shell/(zshrc|warp\.zsh)$
        args: [--severity=error]
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt
        stages: [manual]
  - repo: https://github.com/crate-ci/typos
    rev: v1.48.0
    hooks:
      - id: typos
        args: []
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff-check
