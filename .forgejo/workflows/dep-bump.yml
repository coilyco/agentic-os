# Scheduled dev-base dependency auto-bump. Resolves each pinned tool in
# docker/dev-base/<tier>/Dockerfile against its upstream latest release and, for every
# pin that drifted, commits one ARG bump and pushes to main. The push then rides
# the two-stage flow: promote.yml gates + fast-forwards `release`, and
# release.yml republishes the image family from there, so the
# published dev-base stops lagging upstream with no human editing an ARG by hand
# (agentic-os#272, the ward#288/#301 staleness incident). The resolve+rewrite
# logic is scripts/dep-bump.py; this repo owns the publish pipeline per AGENTS.md
# and fleet rollout stays in infrastructure/ansible. One commit per tool keeps
# the bump auditable and bisectable.
#
# Runs daily at 09:17 UTC (off the hour, to dodge cron rush) and on dispatch.
# DEP_BUMP_TOKEN, when set, is a write:repository PAT so the bump push is
# attributed to a real user and reliably enqueues release.yml; the auto-issued
# job token still pushes without it, but some Forgejo versions suppress workflow
# runs from bot-token pushes. UPSTREAM_GH_TOKEN is optional and only lifts
# github.com's anonymous API rate limit. Full walkthrough: docs/dev-base-auto-bump.md.
# The applied bump tree now runs the repo test/pre-commit gate before the push
# so a bad pin leaves this workflow red and never reaches main.

name: dep-bump

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: docker
    container: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:release
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.DEP_BUMP_TOKEN || github.token }}

      - name: Resolve, commit, and push upstream bumps
        env:
          UPSTREAM_GH_TOKEN: ${{ secrets.UPSTREAM_GH_TOKEN }}
        run: |
          set -euo pipefail

          python3 scripts/dep-bump.py plan > /tmp/dep-bump-plan.tsv
          if [ ! -s /tmp/dep-bump-plan.tsv ]; then
            echo "dev-base pins are current with upstream; nothing to bump."
            exit 0
          fi
          echo "Bumping:"
          cat /tmp/dep-bump-plan.tsv

          git config user.name "coilyco-ops"
          git config user.email "coilyco-ops@coilysiren.me"

          # One commit per tool: auditable history, and a bad bump bisects to its
          # own commit instead of a single batched rewrite.
          while IFS="$(printf '\t')" read -r name current latest; do
            [ -z "$name" ] && continue
            python3 scripts/dep-bump.py apply --arg "$name" --version "$latest"
            git add docker/dev-base/*/Dockerfile
            git commit -m "chore(dev-base): auto-bump ${name} ${current} -> ${latest} (agentic-os#272)"
          done < /tmp/dep-bump-plan.tsv

          # The bumped tree only gets pushed after the repo-authoritative gate
          # passes. Use ward when the CI image has it, otherwise invoke the
          # exact wrapped commands.
          if command -v ward >/dev/null 2>&1; then
            ward exec test
            ward exec pre-commit-all
          else
            uv run pytest
            pre-commit run --all-files
          fi

          git push origin HEAD:main
      - name: Alert Telegram on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_RED_CHAT_ID }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          JOB: ${{ github.job }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          API_BASE: https://api.telegram.org
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          def build_message(repo, workflow, job, ref, sha, run_url):
              return "\n".join([
                  "CI failed on main",
                  f"repo: {repo}",
                  f"workflow: {workflow}",
                  f"job: {job}",
                  f"ref: {ref}",
                  f"sha: {sha}",
                  f"run: {run_url}",
              ])

          def main():
              bot_token = os.environ["BOT_TOKEN"]
              chat_id = os.environ["CHAT_ID"]
              message = build_message(
                  os.environ["REPO"],
                  os.environ["WORKFLOW"],
                  os.environ["JOB"],
                  os.environ["REF"],
                  os.environ["SHA"],
                  os.environ["RUN_URL"],
              )
              payload = urllib.parse.urlencode(
                  {
                      "chat_id": chat_id,
                      "text": message,
                      "disable_web_page_preview": "true",
                  }
              ).encode("utf-8")
              url = f"{os.environ['API_BASE'].rstrip('/')}/bot{bot_token}/sendMessage"
              req = urllib.request.Request(url, data=payload, method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      resp.read()
              except urllib.error.URLError as exc:
                  print(f"telegram alert failed: {exc}")
                  raise SystemExit(1)

          main()
          PY
