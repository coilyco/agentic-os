# Compare the roles baked into agentic-os:release with the latest agent-compose release.
# Rationale: docs/build-file-headers.md.

name: agent-compose-roster-watch

on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - agentic_os/agent_compose_roster_watch.py
      - .forgejo/workflows/agent-compose-roster-watch.yml

permissions:
  contents: read

concurrency:
  group: agent-compose-roster-watch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  watch:
    runs-on: docker
    timeout-minutes: 10
    container: forgejo.coilysiren.me/coilyco/agentic-os:release
    steps:
      - uses: actions/checkout@v6
      - name: Compare the shipped roster against the latest agent-compose release
        run: just agent-compose-roster-watch
      - name: Alert Sentry on roster drift
        if: ${{ failure() && github.event_name != 'pull_request' }}
        continue-on-error: true
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_CI_DSN }}
        run: python3 scripts/alert_sentry.py
