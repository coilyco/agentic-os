# Release aos-precommit only when its installed hook surface changes, which
# includes the package-data contracts a hook reads from the installed package.

name: aos-precommit-release

on:
  push:
    branches: [release]
    paths:
      - ".pre-commit-hooks.yaml"
      - "agentic_os/__init__.py"
      - "agentic_os/config.py"
      - "agentic_os/*.json"
      - "agentic_os/*.yaml"
      - "agentic_os/generators/**"
      - "agentic_os/pre_commit/**"
      - "agentic_os/seed_skills_data.py"
      - "pyproject.toml"
      - "scripts/pr-guard-pre-push.sh"
      - "scripts/trufflehog-scan.sh"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing or explicit aos-precommit tag for a retry."
        required: false
        default: ""
      bump:
        description: "Version bump when tag is empty."
        required: false
        default: "minor"
        type: choice
        options: [minor, patch, major]

concurrency:
  group: aos-precommit-release-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: docker
    timeout-minutes: 20
    container: forgejo.coilysiren.me/coilyco/agentic-os:release
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: tag
        uses: ./actions/tag-bump
        with:
          bump: ${{ github.event.inputs.bump || 'minor' }}
          tag_name: ${{ github.event.inputs.tag || '' }}
          tag_prefix: aos-precommit-v
          create_tag: true
          release_sha: ${{ github.sha }}

      - uses: ./actions/create-release
        with:
          tag: ${{ steps.tag.outputs.new_tag }}
          name: aos-precommit ${{ steps.tag.outputs.new_tag }}
          body: ${{ steps.tag.outputs.changelog }}

      - name: Alert Sentry on release failure
        if: ${{ failure() && github.ref == 'refs/heads/release' }}
        continue-on-error: true
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_CI_DSN }}
        run: python3 scripts/alert_sentry.py
