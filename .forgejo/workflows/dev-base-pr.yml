# Build the heavy dev-base family only when the pull request changes Docker inputs.

name: dev-base-pr

on:
  pull_request:
    paths:
      - "docker/**"
      - "scripts/fs-shims/**"

permissions:
  contents: read

concurrency:
  group: dev-base-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: docker-build
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - name: Build and verify the complete dev-base family
        uses: ./actions/dev-base-build
        with:
          tag: pr-${{ github.run_id }}
