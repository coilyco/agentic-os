# Stage 1 of the two-stage release flow (ward#1117 / aos#469): every main push
# re-runs the full repo gate, publishes the dev-base image family under a
# commit-scoped draft tag, then performs the fallible release publication, and
# only then fast-forwards `release` to that sha. `release` stays the
# last-known-good branch because the version tag, release object, and
# ward-specs asset all land before the branch moves. `release.yml` is now the
# manual retry path for the same publication work and never runs on push.
# Bursts on main collapse to the newest sha (cancel-in-progress: true is
# correct here - promotion is idempotent and a newer gate supersedes an older
# one), while the release publication stays queued but non-canceling. The
# promote push uses CI_RELEASE_TOKEN (real-user PAT from SSM
# /forgejo/ci-release-token) for the final fast-forward: some Forgejo versions
# do not enqueue workflows for job-token pushes, which is how releases
# silently went missing before (agentic-os#240). The checkout sets
# persist-credentials: false because checkout otherwise stores the job token
# as an http extraheader in the local git config, and that Authorization
# header overrides the PAT in the promote push URL. With it off, the push
# authenticates as the PAT user and the release ref moves last.

name: promote

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA to publish. Defaults to the dispatch ref."
        required: false
        default: ""
      tier:
        description: "Tier to publish or resume. all runs the full DAG."
        required: false
        default: "all"
        type: choice
        options:
          - all
          - core
          - lang-node
          - lang-go
          - lang-dotnet
          - ops
          - agent
          - full
      tag:
        description: "Draft tag override. Defaults to draft-<sha>."
        required: false
        default: ""
      bump:
        description: "Version bump for a manual run (minor|major|patch|none). Defaults to minor, matching promoted releases."
        required: false
        default: "minor"
        type: choice
        options:
          - minor
          - major
          - patch
          - none

concurrency:
  group: promote-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  plan-draft:
    runs-on: docker
    timeout-minutes: 20
    container: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:release
    outputs:
      draft_tag: ${{ steps.draft.outputs.draft_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: draft
        name: Derive the draft image tag
        run: |
          set -euo pipefail
          sha="${{ github.event.inputs.sha || github.sha }}"
          tag="${{ github.event.inputs.tag || '' }}"
          if [ -n "$tag" ]; then
            echo "draft_tag=$tag" >> "$GITHUB_OUTPUT"
          else
            echo "draft_tag=draft-${sha}" >> "$GITHUB_OUTPUT"
          fi

      - name: Alert Telegram on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        uses: ./actions/telegram-alert
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_RED_CHAT_ID }}

  gate:
    runs-on: docker
    timeout-minutes: 30
    container: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:release
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Cache pre-commit envs
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Repo test gate
        run: |
          set -euo pipefail
          # Same gate release.yml fronts with: ward verbs when the image
          # carries ward, exact wrapped commands otherwise.
          if command -v ward >/dev/null 2>&1; then
            ward exec test
          else
            uv run pytest
          fi

          if command -v ward >/dev/null 2>&1; then
            ward exec pre-commit-all
          else
            pre-commit run --all-files
          fi

      - name: Install ward from source with workflow bundle support
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          git clone --depth 1 --branch main https://forgejo.coilysiren.me/coilyco-flight-deck/ward.git "$tmpdir/ward"
          cd "$tmpdir/ward"
          go build -trimpath -o "$tmpdir/ward/ward" ./cmd/ward
          "$tmpdir/ward/ward" --version
          echo "WARD_BIN=$tmpdir/ward/ward" >> "$GITHUB_ENV"

      - name: Load the .ward bundle with the updated ward
        run: |
          set -euo pipefail
          export WARD_CONFIG_REF="file://${PWD}/.ward"
          CLIGUARD_NO_SANDBOX=1 "$WARD_BIN" doctor

      - name: Alert Telegram on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        uses: ./actions/telegram-alert
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_RED_CHAT_ID }}

  publish-core:
    needs: [plan-draft, gate]
    if: ${{ github.event_name != 'workflow_dispatch' || contains('all,core,lang-node,lang-go,lang-dotnet,ops,agent,full', github.event.inputs.tier) }}
    runs-on: docker
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: ./actions/publish-dev-base-tier
        with:
          tier: core
          tag: ${{ needs.plan-draft.outputs.draft_tag }}
          registry-token: ${{ secrets.REGISTRY_TOKEN }}
      - name: Alert Telegram on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        uses: ./actions/telegram-alert
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_RED_CHAT_ID }}

  publish-lang-node:
    needs: [plan-draft, publish-core]
    if: ${{ github.event_name != 'workflow_dispatch' || contains('all,lang-node,agent,full', github.event.inputs.tier) }}
    runs-on: docker
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: ./actions/publish-dev-base-tier
        with:
          tier: lang-node
          tag: ${{ needs.plan-draft.outputs.draft_tag }}
          registry-token: ${{ secrets.REGISTRY_TOKEN }}
      - name: Alert Telegram on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        uses: ./actions/telegram-alert
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_RED_CHAT_ID }}

  publish-lang-go:
    needs: [plan-draft, publish-core]
    if: ${{ github.event_name != 'workflow_dispatch' || contains('all,lang-go,full', github.event.inputs.tier) }}
    runs-on: docker
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: ./actions/publish-dev-base-tier
        with:
          tier: lang-go
          tag: ${{ needs.plan-draft.outputs.draft_tag }}
          registry-token: ${{ secrets.REGISTRY_TOKEN }}
      - name: Alert Telegram on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        uses: ./actions/telegram-alert
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_RED_CHAT_ID }}

  publish-lang-dotnet:
    needs: [plan-draft, publish-core]
    if: ${{ github.event_name != 'workflow_dispatch' || contains('all,lang-dotnet,full', github.event.inputs.tier) }}
    runs-on: docker
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: ./actions/publish-dev-base-tier
        with:
          tier: lang-dotnet
          tag: ${{ needs.plan-draft.outputs.draft_tag }}
          registry-token: ${{ secrets.REGISTRY_TOKEN }}
      - name: Alert Telegram on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        uses: ./actions/telegram-alert
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_RED_CHAT_ID }}

  publish-ops:
    needs: [plan-draft, publish-core]
    if: ${{ github.event_name != 'workflow_dispatch' || contains('all,ops,agent,full', github.event.inputs.tier) }}
    runs-on: docker
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: ./actions/publish-dev-base-tier
        with:
          tier: ops
          tag: ${{ needs.plan-draft.outputs.draft_tag }}
          registry-token: ${{ secrets.REGISTRY_TOKEN }}
      - name: Alert Telegram on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        uses: ./actions/telegram-alert
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_RED_CHAT_ID }}

  publish-agent:
    needs: [plan-draft, publish-ops, publish-lang-node]
    if: ${{ github.event_name != 'workflow_dispatch' || contains('all,agent,full', github.event.inputs.tier) }}
    runs-on: docker
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: ./actions/publish-dev-base-tier
        with:
          tier: agent
          tag: ${{ needs.plan-draft.outputs.draft_tag }}
          registry-token: ${{ secrets.REGISTRY_TOKEN }}
      - name: Alert Telegram on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        uses: ./actions/telegram-alert
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_RED_CHAT_ID }}

  publish-full:
    needs: [plan-draft, publish-agent, publish-lang-go, publish-lang-dotnet]
    if: ${{ github.event_name != 'workflow_dispatch' || contains('all,full', github.event.inputs.tier) }}
    runs-on: docker
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: ./actions/publish-dev-base-tier
        with:
          tier: full
          tag: ${{ needs.plan-draft.outputs.draft_tag }}
          registry-token: ${{ secrets.REGISTRY_TOKEN }}
      - name: Alert Telegram on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        uses: ./actions/telegram-alert
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_RED_CHAT_ID }}

  plan-release:
    needs: [publish-full]
    runs-on: docker
    timeout-minutes: 20
    container: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:release
    outputs:
      tag: ${{ steps.tag.outputs.new_tag }}
      version: ${{ steps.tag.outputs.new_version }}
      changelog: ${{ steps.tag.outputs.changelog }}
      draft_tag: ${{ steps.draft.outputs.draft_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: tag
        uses: ./actions/tag-bump
        with:
          bump: ${{ github.event.inputs.bump || 'minor' }}
          create_tag: false

      - id: draft
        name: Derive the draft image tag
        run: |
          set -euo pipefail
          echo "draft_tag=draft-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Alert Telegram on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_RED_CHAT_ID }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          JOB: ${{ github.job }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          API_BASE: https://api.telegram.org
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          def build_message(repo, workflow, job, ref, sha, run_url):
              return "\n".join([
                  "CI failed on main",
                  f"repo: {repo}",
                  f"workflow: {workflow}",
                  f"job: {job}",
                  f"ref: {ref}",
                  f"sha: {sha}",
                  f"run: {run_url}",
              ])

          def main():
              bot_token = os.environ["BOT_TOKEN"]
              chat_id = os.environ["CHAT_ID"]
              message = build_message(
                  os.environ["REPO"],
                  os.environ["WORKFLOW"],
                  os.environ["JOB"],
                  os.environ["REF"],
                  os.environ["SHA"],
                  os.environ["RUN_URL"],
              )
              payload = urllib.parse.urlencode(
                  {
                      "chat_id": chat_id,
                      "text": message,
                      "disable_web_page_preview": "true",
                  }
              ).encode("utf-8")
              url = f"{os.environ['API_BASE'].rstrip('/')}/bot{bot_token}/sendMessage"
              req = urllib.request.Request(url, data=payload, method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      resp.read()
              except urllib.error.URLError as exc:
                  print(f"telegram alert failed: {exc}")
                  raise SystemExit(1)

          main()
          PY

  retag-core:
    needs: [plan-release]
    if: ${{ needs.plan-release.outputs.tag != '' }}
    runs-on: docker
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      - uses: ./actions/publish-dev-base-tier
        with:
          mode: promote
          tier: core
          tag: ${{ needs.plan-release.outputs.tag }}
          source-tag: ${{ needs.plan-release.outputs.draft_tag }}
          alias: release
          extra-aliases: latest
          registry-token: ${{ secrets.REGISTRY_TOKEN }}
          build-timeout: 110m

      - name: Alert Telegram on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        uses: ./actions/telegram-alert
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_RED_CHAT_ID }}

  retag-lang-node:
    needs: [plan-release]
    if: ${{ needs.plan-release.outputs.tag != '' }}
    runs-on: docker
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - uses: ./actions/publish-dev-base-tier
        with:
          mode: promote
          tier: lang-node
          tag: ${{ needs.plan-release.outputs.tag }}
          source-tag: ${{ needs.plan-release.outputs.draft_tag }}
          alias: release
          extra-aliases: latest
          registry-token: ${{ secrets.REGISTRY_TOKEN }}
          build-timeout: 80m

      - name: Alert Telegram on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        uses: ./actions/telegram-alert
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_RED_CHAT_ID }}

  retag-lang-go:
    needs: [plan-release]
    if: ${{ needs.plan-release.outputs.tag != '' }}
    runs-on: docker
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - uses: ./actions/publish-dev-base-tier
        with:
          mode: promote
          tier: lang-go
          tag: ${{ needs.plan-release.outputs.tag }}
          source-tag: ${{ needs.plan-release.outputs.draft_tag }}
          alias: release
          extra-aliases: latest
          registry-token: ${{ secrets.REGISTRY_TOKEN }}
          build-timeout: 80m

      - name: Alert Telegram on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        uses: ./actions/telegram-alert
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_RED_CHAT_ID }}

  retag-lang-dotnet:
    needs: [plan-release]
    if: ${{ needs.plan-release.outputs.tag != '' }}
    runs-on: docker
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - uses: ./actions/publish-dev-base-tier
        with:
          mode: promote
          tier: lang-dotnet
          tag: ${{ needs.plan-release.outputs.tag }}
          source-tag: ${{ needs.plan-release.outputs.draft_tag }}
          alias: release
          extra-aliases: latest
          registry-token: ${{ secrets.REGISTRY_TOKEN }}
          build-timeout: 80m

      - name: Alert Telegram on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        uses: ./actions/telegram-alert
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_RED_CHAT_ID }}

  retag-ops:
    needs: [plan-release]
    if: ${{ needs.plan-release.outputs.tag != '' }}
    runs-on: docker
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - uses: ./actions/publish-dev-base-tier
        with:
          mode: promote
          tier: ops
          tag: ${{ needs.plan-release.outputs.tag }}
          source-tag: ${{ needs.plan-release.outputs.draft_tag }}
          alias: release
          extra-aliases: latest
          registry-token: ${{ secrets.REGISTRY_TOKEN }}
          build-timeout: 80m

      - name: Alert Telegram on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        uses: ./actions/telegram-alert
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_RED_CHAT_ID }}

  retag-agent:
    needs: [plan-release]
    if: ${{ needs.plan-release.outputs.tag != '' }}
    runs-on: docker
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - uses: ./actions/publish-dev-base-tier
        with:
          mode: promote
          tier: agent
          tag: ${{ needs.plan-release.outputs.tag }}
          source-tag: ${{ needs.plan-release.outputs.draft_tag }}
          alias: release
          extra-aliases: latest
          registry-token: ${{ secrets.REGISTRY_TOKEN }}
          build-timeout: 80m

      - name: Alert Telegram on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        uses: ./actions/telegram-alert
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_RED_CHAT_ID }}

  retag-full:
    needs: [plan-release]
    if: ${{ needs.plan-release.outputs.tag != '' }}
    runs-on: docker
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - uses: ./actions/publish-dev-base-tier
        with:
          mode: promote
          tier: full
          tag: ${{ needs.plan-release.outputs.tag }}
          source-tag: ${{ needs.plan-release.outputs.draft_tag }}
          alias: release
          extra-aliases: latest
          registry-token: ${{ secrets.REGISTRY_TOKEN }}
          build-timeout: 80m

      - name: Alert Telegram on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        uses: ./actions/telegram-alert
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_RED_CHAT_ID }}

  publish-release:
    needs:
      - plan-release
      - retag-core
      - retag-lang-node
      - retag-lang-go
      - retag-lang-dotnet
      - retag-ops
      - retag-agent
      - retag-full
    if: ${{ needs.plan-release.outputs.tag != '' }}
    runs-on: docker
    container: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:release
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: tag
        uses: ./actions/tag-bump
        with:
          bump: ${{ github.event.inputs.bump || 'minor' }}
          create_tag: true
          tag_name: ${{ needs.plan-release.outputs.tag }}

      - id: create
        uses: ./actions/create-release
        with:
          tag: ${{ needs.plan-release.outputs.tag }}
          name: ${{ needs.plan-release.outputs.tag }}
          body: ${{ needs.plan-release.outputs.changelog }}

      - name: Publish the ward-specs bundle as a pinned, checksummed release asset
        env:
          FORGEJO_TOKEN: ${{ github.token }}
          FORGEJO_API: https://forgejo.coilysiren.me/api/v1/repos/${{ github.repository }}
          REL_ID: ${{ steps.create.outputs.release_id }}
          TAG: ${{ needs.plan-release.outputs.tag }}
        run: |
          set -euo pipefail
          # FORGEJO_TOKEN is the auto-issued job token that just created the
          # release (contents: write) - the same token create-release used, so
          # asset upload needs no extra secret. If this instance ever denies the
          # built-in token asset scope, this step fails loud and the fix is a PAT
          # secret, mirroring ward's publish-binaries CI_RELEASE_TOKEN.
          # ward's build input is homed here in .ward/ (flattened, aos#330.
          # aos#315 first landed it at top-level ward-specs/). ward's build
          # sites pin + overlay THIS asset so ward's own tree can go neutral
          # without breaking the fleet's brew-from-source install. Pinning to a
          # dedicated tarball asset (not a raw tracked path) gives ward a stable,
          # checksummable URL. See docs/ward-specs.md and ward#503.
          if [ -z "${REL_ID:-}" ]; then
            echo "::error::no release_id from create-release. Cannot attach ward-specs asset" >&2
            exit 1
          fi
          asset="ward-specs-${TAG}.tar.gz"
          # Deterministic tarball: sort entries, zero mtime/owner, no gzip name/time
          # header, so the checksum a downstream pins is reproducible from the tag.
          # The bundle lives in .ward/ beside ward.yaml, so walk the directory and
          # exclude ward.yaml explicitly. That keeps the flat `./`-prefixed member
          # layout ward#503 expects while avoiding a hand-maintained file list.
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -C .ward --exclude=./ward.yaml -cf ward-specs.tar .
          gzip -n -9 -c ward-specs.tar > "${asset}"
          sha256sum "${asset}" | awk '{print $1}' > "${asset}.sha256"
          echo "ward-specs asset sha256: $(cat "${asset}.sha256")"
          # Delete same-named assets first so a workflow_dispatch re-run for an
          # existing tag replaces rather than 400s on a duplicate (ward release.yml
          # convention).
          existing=$(curl -fsSL -H "Authorization: token ${FORGEJO_TOKEN}" \
            "${FORGEJO_API}/releases/${REL_ID}/assets" || echo '[]')
          for name in "${asset}" "${asset}.sha256"; do
            old=$(printf '%s' "$existing" | ASSET="$name" node -e '
              const a = JSON.parse(require("fs").readFileSync(0, "utf8") || "[]");
              const m = (a || []).find(x => x.name === process.env.ASSET);
              if (m) process.stdout.write(String(m.id));
            ')
            if [ -n "$old" ]; then
              curl -fsSL -X DELETE -H "Authorization: token ${FORGEJO_TOKEN}" \
                "${FORGEJO_API}/releases/${REL_ID}/assets/${old}" || true
            fi
            curl -fsSL -X POST -H "Authorization: token ${FORGEJO_TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"${name}" \
              "${FORGEJO_API}/releases/${REL_ID}/assets?name=${name}"
            echo "uploaded ${name}"
          done

  promote-release:
    needs: [publish-release]
    runs-on: docker
    container: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:release
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Promote main to release (fast-forward only)
        env:
          PROMOTE_TOKEN: ${{ secrets.CI_RELEASE_TOKEN }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
        run: |
          set -euo pipefail
          if [ -z "${PROMOTE_TOKEN:-}" ]; then
            echo "::error::CI_RELEASE_TOKEN not set. Promotion needs a real-user PAT for the final release branch fast-forward. Mint from SSM /forgejo/ci-release-token (docs/release.md)." >&2
            exit 1
          fi
          # server_url resolves to the in-cluster http URL on this runner, so
          # keep its scheme instead of assuming https.
          proto="${SERVER%%://*}"
          host="${SERVER#*://}"
          # Plain push: git refuses a non-fast-forward, so a diverged release
          # branch fails loud here instead of being silently rewritten.
          git push "${proto}://oauth2:${PROMOTE_TOKEN}@${host}/${REPO}.git" HEAD:release
          echo "promoted $(git rev-parse --short HEAD) to release"

      - name: Alert Telegram on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        uses: ./actions/telegram-alert
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_RED_CHAT_ID }}
