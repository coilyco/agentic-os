# Promote main to release after the repo gate only. Draft dev-base image
# publishing now runs in a separate workflow keyed by the promoted SHA, so a
# transient registry or build failure cannot stall the release branch.

name: promote

on:
  push:
    branches: [main]

concurrency:
  group: promote-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  gate:
    runs-on: docker
    timeout-minutes: 30
    container: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:release
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Cache pre-commit envs
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Repo test gate
        run: |
          set -euo pipefail
          uv run pytest
          # Same surface release.yml fronts: without this, a pre-commit
          # violation passes the gate and reddens main.
          pre-commit run --all-files

      - name: Install ward from source with workflow bundle support
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          git clone --depth 1 --branch main https://forgejo.coilysiren.me/coilyco-flight-deck/ward.git "$tmpdir/ward"
          cd "$tmpdir/ward"
          go build -trimpath -o "$tmpdir/ward/ward" ./cmd/ward
          "$tmpdir/ward/ward" --version
          echo "WARD_BIN=$tmpdir/ward/ward" >> "$GITHUB_ENV"

      - name: Load the .ward bundle with the updated ward
        run: |
          set -euo pipefail
          export WARD_CONFIG_REF="file://${PWD}/.ward"
          CLIGUARD_NO_SANDBOX=1 "$WARD_BIN" doctor

      - name: Alert Telegram on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        uses: ./actions/telegram-alert
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_RED_CHAT_ID }}

  promote-release:
    needs: [gate]
    runs-on: docker
    container: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:release
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Promote main to release (fast-forward only)
        env:
          PROMOTE_TOKEN: ${{ secrets.CI_RELEASE_TOKEN }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
        run: |
          set -euo pipefail
          if [ -z "${PROMOTE_TOKEN:-}" ]; then
            echo "::error::CI_RELEASE_TOKEN not set. Promotion needs a real-user PAT for the final release branch fast-forward. Mint from SSM /forgejo/ci-release-token (docs/release.md)." >&2
            exit 1
          fi
          proto="${SERVER%%://*}"
          host="${SERVER#*://}"
          git push "${proto}://oauth2:${PROMOTE_TOKEN}@${host}/${REPO}.git" HEAD:release
          echo "promoted $(git rev-parse --short HEAD) to release"

      - name: Alert Telegram on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        uses: ./actions/telegram-alert
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_RED_CHAT_ID }}
