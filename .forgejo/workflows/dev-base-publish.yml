# Publish the draft dev-base image family after release has already advanced.
# The branch promotion workflow only gates and fast-forwards `release`; this
# separate workflow is keyed by that promoted SHA so registry or build flakes
# cannot block branch advancement.

name: dev-base-publish

on:
  push:
    branches: [release]
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA to publish. Defaults to the dispatch ref."
        required: false
        default: ""
      tier:
        description: "Tier to publish or resume. all runs the full DAG."
        required: false
        default: "all"
        type: choice
        options:
          - all
          - core
          - lang-node
          - lang-go
          - lang-dotnet
          - lang-rust
          - lang-python
          - full
      tag:
        description: "Draft tag override. Defaults to draft-<sha>."
        required: false
        default: ""

concurrency:
  group: dev-base-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan-draft:
    runs-on: docker
    timeout-minutes: 20
    container: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:release
    outputs:
      draft_tag: ${{ steps.draft.outputs.draft_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: draft
        name: Derive the draft image tag
        run: |
          set -euo pipefail
          sha="${{ github.event.inputs.sha || github.sha }}"
          tag="${{ github.event.inputs.tag || '' }}"
          if [ -n "$tag" ]; then
            echo "draft_tag=$tag" >> "$GITHUB_OUTPUT"
          else
            echo "draft_tag=draft-${sha}" >> "$GITHUB_OUTPUT"
          fi

      - name: Alert Telegram on release failure
        if: ${{ failure() && github.ref == 'refs/heads/release' }}
        continue-on-error: true
        uses: ./actions/telegram-alert
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_RED_CHAT_ID }}

  publish-core:
    needs: [plan-draft]
    if: ${{ github.event_name != 'workflow_dispatch' || contains('all,core,lang-node,lang-go,lang-dotnet,lang-rust,lang-python,full', github.event.inputs.tier) }}
    runs-on: docker
    timeout-minutes: 120
    steps:
      - name: Acquire core publish source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        shell: bash
        env:
          UV_VERSION: 0.11.26
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --retry-delay 2 -LsSf \
            "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          uv --version

      - name: Install docker CLI + buildx plugin
        shell: bash
        env:
          BUILDX_VERSION: v0.34.1
        run: |
          set -euo pipefail
          docker_cli_ver=$(curl -fsSL https://download.docker.com/linux/static/stable/x86_64/ \
            | grep -oE 'docker-[0-9]+\.[0-9]+\.[0-9]+\.tgz' | sort -V | tail -1 \
            | sed -E 's/^docker-(.*)\.tgz$/\1/')
          curl -fsSL "https://download.docker.com/linux/static/stable/x86_64/docker-${docker_cli_ver}.tgz" \
            | tar -xz -C /tmp
          install /tmp/docker/docker /usr/local/bin/docker
          mkdir -p ~/.docker/cli-plugins
          curl -fsSL "https://github.com/docker/buildx/releases/download/${BUILDX_VERSION}/buildx-${BUILDX_VERSION}.linux-amd64" \
            -o ~/.docker/cli-plugins/docker-buildx
          chmod +x ~/.docker/cli-plugins/docker-buildx
          docker buildx version
          docker --version

      - name: Resolve docker host
        shell: bash
        run: |
          set -euo pipefail
          gw=$(node -e "const fs=require('fs');const l=(fs.readFileSync('/proc/net/route','utf8').split('\n').find(x=>x.split('\t')[1]==='00000000'))||'';const h=l.split(/\s+/)[2]||'';if(h){console.log(h.match(/../g).reverse().map(x=>parseInt(x,16)).join('.'))}" || true)
          for h in "tcp://${gw}:2375" "${DOCKER_HOST:-}" tcp://localhost:2375 unix:///var/run/docker.sock; do
            [ -z "$h" ] && continue
            [ "$h" = "tcp://:2375" ] && continue
            if docker -H "$h" info >/dev/null 2>&1; then
              echo "docker daemon reachable at $h"
              echo "DOCKER_HOST=$h" >> "$GITHUB_ENV"
              echo "selected DOCKER_HOST=$h"
              docker -H "$h" version
              exit 0
            fi
            echo "no docker daemon at $h"
          done
          echo "no reachable docker daemon" >&2
          exit 1

      - name: Derive core publish inputs
        id: core-inputs
        shell: bash
        env:
          REGISTRY_BASE: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os
          TAG: ${{ needs.plan-draft.outputs.draft_tag }}
        run: |
          set -euo pipefail
          eval "$(
            uv run python - <<'PY'
          from pathlib import Path
          import os
          import shlex
          import subprocess

          from agentic_os.dev_base import publish_plan

          plan = publish_plan(os.environ["REGISTRY_BASE"], os.environ["TAG"])
          core = next(entry for entry in plan if entry["tier"] == "core")
          dockerfile = Path(str(core["dockerfile"]))
          values = {
              "CORE_TIER": core["tier"],
              "CORE_TAG": os.environ["TAG"],
              "CORE_IMAGE": core["image"],
              "CORE_CACHE_IMAGE": core["cache_image"],
              "CORE_BASE_IMAGE": core["base_image"],
              "CORE_DOCKERFILE": core["dockerfile"],
              "CORE_CONTEXT_DIR": core["context_dir"],
              "CORE_WARD_CONFIG_REF_COMMIT": subprocess.check_output(
                  ["git", "rev-parse", "HEAD"],
                  text=True,
              ).strip(),
          }
          for key, value in values.items():
              print(f"{key}={shlex.quote(str(value))}")
          PY
          )"
          {
            printf '%s\n' \
              "CORE_TIER=$CORE_TIER" \
              "CORE_TAG=$CORE_TAG" \
              "CORE_IMAGE=$CORE_IMAGE" \
              "CORE_CACHE_IMAGE=$CORE_CACHE_IMAGE" \
              "CORE_BASE_IMAGE=$CORE_BASE_IMAGE" \
              "CORE_DOCKERFILE=$CORE_DOCKERFILE" \
              "CORE_CONTEXT_DIR=$CORE_CONTEXT_DIR" \
              "CORE_WARD_CONFIG_REF_COMMIT=$CORE_WARD_CONFIG_REF_COMMIT"
          } >> "$GITHUB_ENV"
          echo "core publish inputs"
          echo "tier=${CORE_TIER}"
          echo "tag=${CORE_TAG}"
          echo "image=${CORE_IMAGE}"
          echo "cache=${CORE_CACHE_IMAGE}"
          echo "base=${CORE_BASE_IMAGE}"
          echo "dockerfile=${CORE_DOCKERFILE}"
          echo "context=${CORE_CONTEXT_DIR}"

      - name: Registry login
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          retry() {
            local attempts="$1"
            shift
            local delay=2
            local n=1
            while true; do
              if "$@"; then
                return 0
              fi
              if [ "$n" -ge "$attempts" ]; then
                return 1
              fi
              echo "registry login failed, retrying in ${delay}s" >&2
              sleep "$delay"
              n=$((n + 1))
              delay=$((delay * 2))
            done
          }
          login_once() {
            printf "%s" "$REGISTRY_TOKEN" | docker login forgejo.coilysiren.me -u coilyco-ops --password-stdin
          }
          if [ -z "${REGISTRY_TOKEN:-}" ]; then
            echo "::error::REGISTRY_TOKEN not set. Mint a forgejo PAT with write:package and add it as an Actions secret. See docs/dev-base-image.md." >&2
            exit 1
          fi
          retry 4 login_once

      - name: Check whether the tier already landed
        id: checkpoint
        shell: bash
        env:
          MODE: build
          TIER: core
          TAG: ${{ needs.plan-draft.outputs.draft_tag }}
          IMAGE_BASE: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os
        run: |
          set -euo pipefail
          alias_args=()
          if uv run python scripts/dev-base-build.py \
            --registry "${IMAGE_BASE}" \
            --tag "${TAG}" \
            "${alias_args[@]}" \
            check \
            --mode "${MODE}" \
            --tier "${TIER}"
          then
            echo "skip_publish=true" >> "$GITHUB_OUTPUT"
          else
            rc=$?
            if [ "$rc" -ne 1 ]; then
              exit "$rc"
            fi
            echo "skip_publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up qemu + reuse the persistent buildx builder
        if: ${{ steps.checkpoint.outputs.skip_publish != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "buildx before bootstrap"
          docker buildx ls
          docker run --privileged --rm tonistiigi/binfmt --install all
          if ! docker buildx inspect aosbuilder >/dev/null 2>&1; then
            docker buildx create --name aosbuilder \
              --driver docker-container --driver-opt network=host || true
          fi
          if ! docker buildx inspect aosbuilder --bootstrap; then
            echo "aosbuilder exists but fails to bootstrap. Recreating it (warm cache is lost this once)"
            docker buildx rm -f aosbuilder 2>/dev/null || true
            docker buildx create --name aosbuilder \
              --driver docker-container --driver-opt network=host
            docker buildx inspect aosbuilder --bootstrap
          fi
          docker buildx use aosbuilder
          echo "buildx after bootstrap"
          docker buildx ls

      - name: Publish core image
        if: ${{ steps.checkpoint.outputs.skip_publish != 'true' }}
        shell: bash
        env:
          REGISTRY_BASE: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os
          TAG: ${{ needs.plan-draft.outputs.draft_tag }}
          BUILD_TIMEOUT: 110m
          PLATFORMS: linux/amd64,linux/arm64
        run: |
          set -euo pipefail
          timeout --preserve-status --kill-after=5m "${BUILD_TIMEOUT}" \
            uv run python scripts/dev-base-build.py \
            --registry "${REGISTRY_BASE}" \
            --tag "${TAG}" \
            build \
            --push \
            --tier core \
            --platforms "${PLATFORMS}"

      - name: Alert Telegram on release failure
        if: ${{ failure() && github.ref == 'refs/heads/release' }}
        continue-on-error: true
        uses: ./actions/telegram-alert
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_RED_CHAT_ID }}

  publish-lang-node:
    needs: [plan-draft, publish-core]
    if: ${{ github.event_name != 'workflow_dispatch' || contains('all,lang-node,full', github.event.inputs.tier) }}
    runs-on: docker
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: ./actions/publish-dev-base-tier
        with:
          tier: lang-node
          tag: ${{ needs.plan-draft.outputs.draft_tag }}
          registry-token: ${{ secrets.REGISTRY_TOKEN }}
      - name: Alert Telegram on release failure
        if: ${{ failure() && github.ref == 'refs/heads/release' }}
        continue-on-error: true
        uses: ./actions/telegram-alert
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_RED_CHAT_ID }}

  publish-lang-go:
    needs: [plan-draft, publish-core]
    if: ${{ github.event_name != 'workflow_dispatch' || contains('all,lang-go,full', github.event.inputs.tier) }}
    runs-on: docker
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: ./actions/publish-dev-base-tier
        with:
          tier: lang-go
          tag: ${{ needs.plan-draft.outputs.draft_tag }}
          registry-token: ${{ secrets.REGISTRY_TOKEN }}
      - name: Alert Telegram on release failure
        if: ${{ failure() && github.ref == 'refs/heads/release' }}
        continue-on-error: true
        uses: ./actions/telegram-alert
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_RED_CHAT_ID }}

  publish-lang-dotnet:
    needs: [plan-draft, publish-core]
    if: ${{ github.event_name != 'workflow_dispatch' || contains('all,lang-dotnet,full', github.event.inputs.tier) }}
    runs-on: docker
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: ./actions/publish-dev-base-tier
        with:
          tier: lang-dotnet
          tag: ${{ needs.plan-draft.outputs.draft_tag }}
          registry-token: ${{ secrets.REGISTRY_TOKEN }}
      - name: Alert Telegram on release failure
        if: ${{ failure() && github.ref == 'refs/heads/release' }}
        continue-on-error: true
        uses: ./actions/telegram-alert
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_RED_CHAT_ID }}

  publish-lang-rust:
    needs: [plan-draft, publish-core]
    if: ${{ github.event_name != 'workflow_dispatch' || contains('all,lang-rust,full', github.event.inputs.tier) }}
    runs-on: docker
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: ./actions/publish-dev-base-tier
        with:
          tier: lang-rust
          tag: ${{ needs.plan-draft.outputs.draft_tag }}
          registry-token: ${{ secrets.REGISTRY_TOKEN }}
      - name: Alert Telegram on release failure
        if: ${{ failure() && github.ref == 'refs/heads/release' }}
        continue-on-error: true
        uses: ./actions/telegram-alert
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_RED_CHAT_ID }}

  publish-lang-python:
    needs: [plan-draft, publish-core]
    if: ${{ github.event_name != 'workflow_dispatch' || contains('all,lang-python,full', github.event.inputs.tier) }}
    runs-on: docker
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: ./actions/publish-dev-base-tier
        with:
          tier: lang-python
          tag: ${{ needs.plan-draft.outputs.draft_tag }}
          registry-token: ${{ secrets.REGISTRY_TOKEN }}
      - name: Alert Telegram on release failure
        if: ${{ failure() && github.ref == 'refs/heads/release' }}
        continue-on-error: true
        uses: ./actions/telegram-alert
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_RED_CHAT_ID }}

  publish-full:
    needs: [plan-draft, publish-lang-node, publish-lang-go, publish-lang-dotnet, publish-lang-rust, publish-lang-python]
    if: ${{ github.event_name != 'workflow_dispatch' || contains('all,full', github.event.inputs.tier) }}
    runs-on: docker
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: ./actions/publish-dev-base-tier
        with:
          tier: full
          tag: ${{ needs.plan-draft.outputs.draft_tag }}
          registry-token: ${{ secrets.REGISTRY_TOKEN }}
      - name: Alert Telegram on release failure
        if: ${{ failure() && github.ref == 'refs/heads/release' }}
        continue-on-error: true
        uses: ./actions/telegram-alert
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_RED_CHAT_ID }}
