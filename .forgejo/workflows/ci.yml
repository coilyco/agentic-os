# Pull-request CI gate for director-merge repos. This is the live version of
# docs/ci-in-dev-base-example.yml, and branch protection can require the
# resulting `ci / gate` status context on PR-gated workflows. `release` is the
# promoted last-known-good branch (ward#1117 / aos#469) and never re-gates:
# promote.yml already ran the suite on the exact sha it fast-forwarded, so a
# flaky rerun cannot fail a vouched promotion (Kai's call, 2026-07-12).
#
# The ward-doctor job is the standalone guardfile-load gate: guardfiles are
# config, so their validity check is ward loading them, never repo tests
# re-encoding their content. It is the same doctor the core image build runs
# (the aos#452 fail-closed path), moved up to commit time so a broken bundle
# cannot reach main.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  WARD_WORKFLOW_VERSION: v0.775.0-tmp

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ward-doctor:
    runs-on: docker
    timeout-minutes: 20
    container: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:release
    steps:
      - uses: actions/checkout@v6
      - name: Install validated ward for workflow bundle support
        run: scripts/install-workflow-ward.sh "${WARD_WORKFLOW_VERSION}"
      - name: Load the .ward bundle with the updated ward
        run: WARD_CONFIG_REF="file://${PWD}/.ward" CLIGUARD_NO_SANDBOX=1 ward doctor

  gate:
    runs-on: docker
    timeout-minutes: 30
    container: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:release
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install validated ward for repo gate
        run: scripts/install-workflow-ward.sh "${WARD_WORKFLOW_VERSION}"

      - name: Cache pre-commit envs
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Repo test gate
        run: bash "$GITHUB_WORKSPACE/scripts/ci/repo-test-gate.sh"
      - name: Alert Telegram on main failure
        if: ${{ failure() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release') }}
        continue-on-error: true
        uses: ./actions/telegram-alert
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_RED_CHAT_ID }}
