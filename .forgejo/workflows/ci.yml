# Pull-request CI gate for director-merge repos. This is the live version of
# docs/ci-in-dev-base-example.yml, and branch protection can require the
# resulting `ci / gate` status context on PR-gated workflows. `release` is the
# promoted last-known-good branch (ward#1117 / aos#469) and never re-gates:
# promote.yml already ran the suite on the exact sha it fast-forwarded, so a
# flaky rerun cannot fail a vouched promotion (Kai's call, 2026-07-12).
#
# The Ward doctor job validates only Ward's supported YAML contract. Role
# policy and operator grants are intentionally absent from this repository.
# AOS CLI and Python package tests stay on every build. The separate
# dev-base-pr workflow is path-filtered to Docker changes.
#
# uv builds the local packages through PEP 517, which resolves setuptools from
# PyPI whenever the uv cache is cold. That egress flakes on this runner, so the
# jobs cache ~/.cache/uv and raise uv's 30s HTTP timeout.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  UV_HTTP_TIMEOUT: "180"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aos-cli-tests:
    runs-on: docker
    timeout-minutes: 20
    container: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:release
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Test the AOS CLI
        run: just aos-test
      - name: Test the native terminal companion
        run: just aterm-test

  gate:
    runs-on: docker
    timeout-minutes: 30
    container: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:release
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Cache uv downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-


      - name: Test the Python package and pre-commit hooks
        run: bash "$GITHUB_WORKSPACE/scripts/ci-command.sh" bash "$GITHUB_WORKSPACE/scripts/ci/repo-test-gate.sh"
      - name: Alert Telegram on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        uses: ./actions/telegram-alert
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_RED_CHAT_ID }}
