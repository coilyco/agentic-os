# Pull-request CI gate for director-merge repos.
# Rationale: docs/build-file-headers.md.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  UV_HTTP_TIMEOUT: "180"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aos-cli-tests:
    runs-on: docker
    timeout-minutes: 20
    container: forgejo.coilysiren.me/coilyco/agentic-os:release
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Use the system git while the release image carries the umbra git shim
        run: bash "$GITHUB_WORKSPACE/scripts/ci/plain-git.sh"
      - name: Test the AOS CLI
        run: just aos-test
      - name: Test the native terminal companion
        run: just aterm-test

  gate:
    runs-on: docker
    timeout-minutes: 30
    container: forgejo.coilysiren.me/coilyco/agentic-os:release
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Use the system git while the release image carries the umbra git shim
        run: bash "$GITHUB_WORKSPACE/scripts/ci/plain-git.sh"

      - name: Cache uv downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-


      - name: Test the Python package and pre-commit hooks
        run: bash "$GITHUB_WORKSPACE/scripts/ci-command.sh" bash "$GITHUB_WORKSPACE/scripts/ci/repo-test-gate.sh"
      - name: Alert Sentry on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_CI_DSN }}
        run: python3 scripts/alert_sentry.py
