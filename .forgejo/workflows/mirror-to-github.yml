# Fast-forward Forgejo main+tags onto the read-only GitHub mirror.
# Rationale: docs/build-file-headers.md.

name: mirror-to-github

on:
  push:
    branches: [main]
    tags: ['v*', 'aos-precommit-v*']

concurrency:
  group: mirror-to-github-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: docker
    timeout-minutes: 30
    container: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:release
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0


      - name: Repo test gate
        run: bash "$GITHUB_WORKSPACE/scripts/ci/mirror-to-github.sh" test

      - name: Alert Telegram on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        uses: ./actions/telegram-alert
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_RED_CHAT_ID }}
  mirror:
    needs: test
    runs-on: docker
    timeout-minutes: 15
    container: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:release
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Mirror to GitHub
        env:
          PAT: ${{ secrets.GITHUB_MIRROR_PAT }}
        run: bash "$GITHUB_WORKSPACE/scripts/ci/mirror-to-github.sh" mirror
      - name: Alert Telegram on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        uses: ./actions/telegram-alert
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_RED_CHAT_ID }}
