# Cross-repo pre-commit hooks shipped by coilyco-flight-deck/agentic-os.
# Consumers reference via:
#
#   - repo: https://forgejo.coilysiren.me/coilyco-flight-deck/agentic-os
#     rev: v0.1.0
#     hooks:
#       - id: catalog-doc-size
#       - id: catalog-trifecta
#       - id: code-review-contract
#       - id: documentation-layout
#       - id: context-load-points
#       - id: code-comments
#       - id: actions-run-one-line
#       - id: source-doc-refs
#       - id: catalog-block-present
#       - id: check-skills
#       - id: check-composed-skills
#       - id: dead-cross-links
#       - id: repo-pointer-skills
#       - id: agents-pointer
#       - id: misplaced-skills
#       - id: yaml-strict
#       - id: seed-skills
#       - id: trufflehog
#       - id: unresolved-placeholder-guard  # manual opt-in
#       - id: issue-reference-guard         # manual opt-in
#
# See docs/features-release-tooling.md for the trifecta convention.
# Rollout helper: agentic-os/scripts/apply-agentic-os-hooks.py.
#
# Intentionally NOT hooks. See docs/features-release-tooling.md for the
# authoring-vs-rollout split behind these CLI-only validators.
# Three authored validators are CLI/on-demand tools, not commit-path hooks, and
# ship as ward verbs instead (cli-guard/ward fenced). Wiring them here would
# need new file-discovery logic the issue forbids, and would falsely flag every
# consumer as missing until a fleet rollout caught up:
#   - check_ssm_path     -> ward ssm-path     (validates paths passed as args,
#                           no repo-file trigger; no-arg invocation is an error)
#   - check_aws_config   -> ward aws-config   (lints the ~/.aws/config machine
#                           file, not repo content)
#   - check_context_budget -> ward context-budget (on-demand by design; see
#                           docs/context-budget.md)

- id: catalog-doc-size
  name: Markdown size caps
  description: Compatibility alias for documentation-layout Markdown size caps.
  entry: check-catalog-doc-size
  language: python
  always_run: true
  pass_filenames: false
  stages: [pre-commit]

- id: catalog-trifecta
  name: catalog-trifecta cross-link convention
  description: Enforce that README + AGENTS + docs/FEATURES + .ward/ward.yaml cross-link. See docs/features-release-tooling.md.
  entry: check-catalog-trifecta
  language: python
  always_run: true
  pass_filenames: false
  stages: [pre-commit]

- id: code-review-contract
  name: code review contract
  description: Enforce a root CODE-REVIEW.md with localized-invariant, historical-issue, and refresh-trigger guidance.
  entry: check-code-review-contract
  language: python
  always_run: true
  pass_filenames: false
  stages: [pre-commit]

- id: documentation-layout
  name: documentation layout
  description: "Enforce Markdown placement and size: root allow-list, flat docs/, skill folders only, 80 lines / 4000 chars."
  entry: check-documentation-layout
  language: python
  always_run: true
  pass_filenames: false
  stages: [pre-commit]

- id: context-load-points
  name: agent context load-points
  description: "Enforce the AGENTS/CLAUDE load-point framework: pure-pointer CLAUDE.md, no forked rungs in subdirs, root AGENTS.md needs a `@AGENTS.md` bridge. See docs/context-load-points.md."
  entry: check-context-load-points
  language: python
  always_run: true
  pass_filenames: false
  stages: [pre-commit]

- id: code-comments
  name: code comment discipline
  description: Cap inline comments at two contiguous 90-char lines (a top-of-file header block is exempt); YAML allows comments only in that top block.
  entry: check-code-comments
  language: python
  always_run: true
  pass_filenames: false
  stages: [pre-commit]

- id: actions-run-one-line
  name: Actions run steps stay one line
  description: "Reject multiline run commands in GitHub and Forgejo workflows and composite actions. Move script bodies into tracked language-native files. See docs/pre-commit-hygiene.md."
  entry: check-actions-run-one-line
  language: python
  additional_dependencies: [pyyaml]
  always_run: true
  pass_filenames: false
  files: '(^|/)(\.github/workflows/.*\.ya?ml|\.forgejo/workflows/.*\.ya?ml|action\.ya?ml)$'
  stages: [pre-commit]

- id: source-doc-refs
  name: source doc references
  description: Validate path-like documentation references in source comments so doc burndowns cannot leave stale pointers behind.
  entry: check-source-doc-refs
  language: python
  always_run: true
  pass_filenames: false
  stages: [pre-commit]

- id: catalog-block-present
  name: .ward/ward.yaml catalog block present
  description: Assert this repo declares its catalog metadata. See docs/ward-specs.md.
  entry: check-catalog-block
  language: python
  additional_dependencies: [pyyaml]
  always_run: true
  pass_filenames: false
  stages: [pre-commit]

- id: check-skills
  name: skill conventions
  description: Validate the structure of .agents/skills/ against .agents/skills/categories.yaml.
  entry: check-skills
  language: python
  additional_dependencies: [pyyaml]
  pass_filenames: false
  always_run: true
  stages: [pre-commit, pre-push]

- id: check-composed-skills
  name: composed skill conventions
  description: Validate role-composed COMPOSED.md sources against the ordinary skill taxonomy while preventing native discovery and name collisions.
  entry: check-composed-skills
  language: python
  additional_dependencies: [pyyaml]
  pass_filenames: false
  always_run: true
  stages: [pre-commit, pre-push]

- id: dead-cross-links
  name: dead cross-links
  description: Validate that inline markdown links anywhere in the repo resolve to real files and never escape the repo root.
  entry: check-dead-links
  language: python
  pass_filenames: false
  always_run: true
  stages: [pre-commit, pre-push]

- id: repo-pointer-skills
  name: repo-pointer skills auto-generated
  description: Regenerate every repo-<name> pointer skill offline and fail on drift from generator output. See docs/features-agents-pointer.md.
  entry: check-repo-pointer-skills
  language: python
  additional_dependencies: [pyyaml]
  always_run: true
  pass_filenames: false
  stages: [pre-commit]

- id: agents-pointer
  name: AGENTS.md pointer block auto-generated
  description: Regenerate the managed workspace-pointer block in AGENTS.md offline and fail on drift. No-ops for unmanaged orgs and the canonical base repos. See docs/features-agents-pointer.md.
  entry: check-agents-pointer
  language: python
  always_run: true
  pass_filenames: false
  stages: [pre-commit]

- id: misplaced-skills
  name: no foreign repo-specific skills
  description: "Assert a repo does not host skills owned by another repo. Opt in via [tool.agentic-os.misplaced-skills] deny/allow globs; no-ops otherwise. See docs/skill-discipline-authoring-shipping.md."
  entry: check-misplaced-skills
  language: python
  always_run: true
  pass_filenames: false
  stages: [pre-commit]

- id: seed-skills
  name: code present implies seed-skill references
  description: "Assert a repo references the seed skills its code requires (always-set plus one per detected language) so qwen-opencode ingests the right context. Opt in via [tool.agentic-os.seed-skills]; no-ops otherwise. Ansible enables it fleet-wide. See docs/skill-discipline-authoring-shipping.md."
  entry: check-seed-skills
  language: python
  additional_dependencies: [pyyaml]
  always_run: true
  pass_filenames: false
  stages: [pre-commit]

- id: agent-compose-size
  name: agent-compose source size budget
  description: "Cap each AGENTS.COMPOSE.md and the repo's aggregate AGENTS.COMPOSE.md size. The composed file loads every session. See docs/context-budget.md."
  entry: check-agent-compose-size
  language: python
  always_run: true
  pass_filenames: false
  stages: [pre-commit]

- id: agent-compose-dedup
  name: agent-compose dedup
  description: "Reject doctrine duplicated across AGENTS.COMPOSE.md sources or already present in the repo's AGENTS.md cascade. See docs/context-budget.md."
  entry: check-agent-compose-dedup
  language: python
  always_run: true
  pass_filenames: false
  stages: [pre-commit]

- id: agent-compose-drift
  name: agent-compose composed-file drift
  description: "Verify ~/.config/agent-compose/COMPOSED.md is reproducible from the composer (not hand-edited or stale). Machine-state check; no-op without a config. See docs/context-budget.md."
  entry: check-agent-compose-drift
  language: python
  always_run: true
  pass_filenames: false
  stages: [pre-commit]

- id: yaml-strict
  name: strict canonical YAML
  description: "Autofix YAML to a deterministic canonical form: recursive mapping-key alpha-sort, recursive sequence sort by canonical serialization, comment stripping, single trailing newline, explicit --- start, 2-space indent. Rejects (without fixing) duplicate keys and anchors/aliases/tags. Re-stage after a fix. Dials + opt-outs under [tool.agentic-os.yaml-strict] (sort_sequences, no_comments, order_significant, excludes). See docs/features-release-tooling.md."
  entry: check-yaml-strict
  language: python
  additional_dependencies: ["ruamel.yaml>=0.18"]
  types: [yaml]
  stages: [pre-commit]

- id: trufflehog
  name: trufflehog (secret scan, offline)
  description: Detect secrets in staged changes via local trufflehog binary (no API verification). Excludes gitignored build/cache dirs (target/, .venv/, node_modules/, ...) so a trufflehog build that walks untracked working-tree files does not block commits with artifact false positives. Requires the trufflehog binary on PATH (shipped in the agentic-os Brewfile).
  entry: scripts/trufflehog-scan.sh
  language: script
  pass_filenames: false
  stages: [pre-commit, pre-push]

- id: leak-guard
  name: encoded leak guard
  description: "Reject plaintext occurrences of awkward-leak terms (employer/partner names, private->public references, dependency-cycle back-references) held as hex in agentic_os/pre_commit/leak_guard_rules.py and decoded only in memory. Rule scope matches the current repo, so a rule fires only where it should. See docs/leak-guard.md."
  entry: check-leak-guard
  language: python
  always_run: true
  pass_filenames: false
  stages: [pre-commit]

- id: unresolved-placeholder-guard
  name: unresolved placeholder guard
  description: "Reject unresolved placeholder prose like TODO implement, stub, placeholder, lorem, and generated apology/provenance phrases. Ships manual-only so repos can opt in once they have allowlists."
  entry: check-unresolved-placeholders
  language: python
  always_run: true
  pass_filenames: false
  stages: [manual]

- id: issue-reference-guard
  name: issue reference guard
  description: "Reject direct issue references in tracked prose so durable docs, not issue-thread anchors, carry long-lived meaning. Skips fenced code, inline code, quoted examples, and test fixtures, and leaves external upstream issue links alone. Ships manual-only pending repo-specific rollout and allowlists."
  entry: check-issue-references
  language: python
  always_run: true
  pass_filenames: false
  stages: [manual]
