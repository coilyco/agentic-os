[general]
live_config_reload = true

[window]
decorations = "Full"
decorations_theme_variant = "Dark"
dynamic_padding = true
opacity = 1.0
padding = { x = 8, y = 8 }
startup_mode = "Windowed"

[font]
size = 14.5

[colors.primary]
background = "#0d0a1c"
foreground = "#fafbff"

[colors.cursor]
cursor = "#ff5ec4"
text = "#0d0a1c"

[colors.selection]
background = "#ff5ec4"
text = "#0d0a1c"

[colors.normal]
black = "#0d0a1c"
red = "#ff5a7a"
green = "#5fe69f"
yellow = "#ffd866"
blue = "#7aa8d8"
magenta = "#ff5ec4"
cyan = "#1fd6e8"
white = "#fafbff"

[colors.bright]
black = "#6a5f9a"
red = "#ff8aa2"
green = "#8af0bd"
yellow = "#ffe399"
blue = "#a8b8e0"
magenta = "#ff95da"
cyan = "#6ae4f0"
white = "#ffffff"

[terminal]
osc52 = "OnlyCopy"

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"

# macOS native tabs are unwanted. Cmd+T spawns a window instead of a tab, and the
# tab-navigation defaults are inhibited so no tab surface remains. "None" rather
# than "ReceiveChar" keeps these from typing a stray character into the shell.
[[keyboard.bindings]]
key = "T"
mods = "Command"
action = "CreateNewWindow"

[[keyboard.bindings]]
key = "]"
mods = "Command|Shift"
action = "None"

[[keyboard.bindings]]
key = "["
mods = "Command|Shift"
action = "None"

[[keyboard.bindings]]
key = "Tab"
mods = "Command"
action = "None"

[[keyboard.bindings]]
key = "Tab"
mods = "Command|Shift"
action = "None"

[[keyboard.bindings]]
key = "1"
mods = "Command"
action = "None"

[[keyboard.bindings]]
key = "2"
mods = "Command"
action = "None"

[[keyboard.bindings]]
key = "3"
mods = "Command"
action = "None"

[[keyboard.bindings]]
key = "4"
mods = "Command"
action = "None"

[[keyboard.bindings]]
key = "5"
mods = "Command"
action = "None"

[[keyboard.bindings]]
key = "6"
mods = "Command"
action = "None"

[[keyboard.bindings]]
key = "7"
mods = "Command"
action = "None"

[[keyboard.bindings]]
key = "8"
mods = "Command"
action = "None"

[[keyboard.bindings]]
key = "9"
mods = "Command"
action = "None"
