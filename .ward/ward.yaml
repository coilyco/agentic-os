# Per-repo command allowlist. Add verbs here as they emerge.

commands:
  alacritty-config-check:
    run: alacritty migrate --dry-run --config-file alacritty/alacritty.toml
    description: "Validate the shared Alacritty configuration against the installed Alacritty schema."
  agent-terminal:
    run: go run -C agent-terminal .
    description: "Launch one agent-compose branded Alacritty director window. Pass role, seat, task title, and a child command after `--`; use `--dry-run` to inspect without opening a window."
  agent-terminal-build:
    run: go build -C agent-terminal ./...
    description: "Compile the branded Alacritty director launcher."
  agent-terminal-test:
    run: go test -C agent-terminal ./...
    description: "Run the branded Alacritty director launcher tests."
  agent-terminal-lint:
    run: go vet -C agent-terminal ./...
    description: "Run Go static analysis for the branded Alacritty director launcher."
  agent-terminal-fmt:
    run: gofmt -w agent-terminal
    description: "Format the branded Alacritty director launcher."
  agent-terminal-tidy:
    run: go mod tidy -C agent-terminal
    description: "Reconcile the branded Alacritty director launcher's Go module metadata."
  warp:
    run: go run -C warp .
    description: "Establish and verify Kai's Warp config across hosts. `ward exec warp apply` renders all three state layers (repo template, config-dir TOML, SQLite); `ward exec warp doctor` reports drift. See project-a-ward-exec-warp.md."
  warp-test:
    run: go test -C warp ./...
    description: "Run the Warp config Go test suite."
  aos-say:
    run: go run -C aos-say .
    description: "Speak short status text with the Mac-integrated `aos-say` client. On Darwin it calls `/usr/bin/say` directly, and on other hosts it forwards one JSON request to the configured relay. Use `ward exec aos-say -- relay` for the relay entrypoint."
  aos-say-test:
    run: go test -C aos-say ./...
    description: "Run the `aos-say` Go test suite."
  aos-build:
    run: go build -C aos ./...
    description: "Compile the standalone Go `aos` container launcher."
  aos-clean:
    run: go clean -C aos
    description: "Remove the local standalone Go `aos` build artifact."
  aos-test:
    run: go test -C aos ./...
    description: "Run the standalone Go `aos` launcher test suite."
  aos-fmt:
    run: gofmt -w aos
    description: "Format the standalone Go `aos` launcher."
  aos-lint:
    run: go vet -C aos ./...
    description: "Run Go static analysis for the standalone `aos` launcher."
  aos-tidy:
    run: go mod tidy -C aos
    description: "Reconcile the standalone Go `aos` launcher's module dependencies."
  aos-install:
    run: go install -C aos .
    description: "Install the standalone Go `aos` launcher into GOBIN."
  aos-release-build:
    run: sh scripts/aos-release-build.sh
    description: "Cross-compile version-stamped `aos` release binaries and checksums from the owning target manifest."
  aos-release-package:
    run: sh scripts/render-aos-packaging.sh
    description: "Render the `aos` Homebrew formula and Scoop manifest from release binaries."
  aos-release-check:
    run: sh scripts/check-aos-release.sh
    description: "Verify `aos` release checksums, package metadata, and the native version-stamped binary."
  release-impact:
    run: uv run python -m agentic_os.release_impact
    description: "Decide whether changed paths require an AOS CLI, aos-precommit, or dev-base artifact release. Pass `--surface aos-cli|aos-precommit|dev-base` plus `--base REF`, repeated `--changed-path PATH`, or `--force` after `--`."
  workflow-ward-install-check:
    run: bash scripts/install-workflow-ward.sh
    description: "Build the Ward version used by Actions from the generated tag at the production release branch. Pass an explicit ref and temporary output path after `--` to override."
  repo-test-gate:
    run: bash scripts/ci/repo-test-gate.sh
    description: "Run the exact repository CI gate, bootstrapping the pinned specgen release before pytest and the full pre-commit suite."
  prod-install-ref:
    run: python3 -m agentic_os.prod_install_ref
    description: "Resolve guard, Ward, or AOS to the immutable generated tag at its production release branch, falling back to the literal `release` ref."
  aos-dry-run:
    run: ./aos/aos --role engineer --dry-run acompose -- codex --version
    description: "Render the default standalone composed-container launch without starting Docker."
  aos-composition-dry-run:
    run: ./aos/aos --agent codex --role engineer --warded --dry-run --
    description: "Render the always-composed, always-guarded Ward launch without starting Docker. Pass the Ward issue or freeform arguments after `--`."
  aos-composition-smoke:
    run: bash scripts/aos-composition-smoke.sh
    description: "Materialize the full local context bundle and render Ward's launch without starting an agent container. Pass the Ward issue or freeform arguments after `--`."
  qa-verification-fixture:
    run: bash scripts/qa-verification-fixture.sh
    description: "Run one disposable, admitted director-to-engineer-to-QA proof in coilyco-flight-deck/ward-qa-fixture, then stop the run, delete its issue branch, and close its issue. Pass `--preserve-on-failure` only when QA needs the failed branch and issue retained as evidence."
  aos-standalone-composition-smoke:
    run: ./aos/aos --agent codex --role engineer --image agentic-os:aos-local --auth=false -- --version
    description: "Launch the selected agent in one standalone AOS container with composed context and the aosguard skill, then print the agent version."
  aosguard-lock:
    run: sh scripts/aosguard-lock.sh
    description: "Refresh aosguard's vendored API snapshot and frozen cli-guard dependency graph with the packaged specgen driver."
  aosguard-build:
    run: specgen --project-root .specgen/guardfiles --skills-out dist/skills build --out dist/aosguard
    description: "Materialize the standalone aosguard operator CLI and native generated skill from the independent .specgen snapshot."
  aosguard-release-fmt:
    run: gofmt -w aosguard-release
    description: "Format the native AOSguard release wrapper."
  aosguard-run:
    run: specgen --project-root .specgen/guardfiles run --
    description: "Materialize and run aosguard from the independent .specgen snapshot, passing arguments after `--`."
  aos-image-build:
    run: uv run python scripts/dev-base-build.py --registry agentic-os --tag aos-local build
    description: "Build the five local language images and fan them into agentic-os:aos-local for standalone `aos` smoke testing."
  aos-container-smoke:
    run: go run -C aos . --role engineer --layout codex --image agentic-os:aos-local acompose -- sh testdata/codex-smoke.sh
    description: "Launch the full local image through `aos`, compose the engineer Codex HOME, verify its container-boundary defaults, hydrate substrate, and print the in-container Codex version."
  aos-designer-smoke:
    run: ./aos/aos --role designer --layout codex --image agentic-os:aos-local --auth=false --no-substrate acompose -- sh scripts/aos-designer-smoke.sh
    description: "Launch the full local image as the designer Codex variant and verify its projected AGENTS.md briefing, selected composed skill, entry-point promotion, and role isolation."
  aos-role-question:
    run: sh scripts/aos-role-question.sh
    description: "Ask one composed role a real question through cloud Codex or Goose with a local model, enforce a bounded run, and require the response to confirm its loaded role. Usage: `ward exec aos-role-question -- cloud|local ROLE [MODEL]`."
  sync-harness-board:
    run: uv run python -m agentic_os.harness_board_sync
    description: "Validate AOS's role-intent-harness source against its harness registry, then project `.agents/roles.kdl` and the compiled `aos/role-harnesses.json` launcher view. `-- --check` reports drift without writing. See docs/harness-selection.md."
  sync-role-personalities:
    run: uv run python -m agentic_os.role_personality_sync
    description: "Project agent-compose's emitted person snapshot into `aos/role-personalities.json` for measurement alignment. `-- --check` reports drift without writing. See docs/role-orientation-projections.md."
  dev-base-build:
    run: uv run python scripts/dev-base-build.py --registry agentic-os --tag dev-base-local build
    description: "Build the Ubuntu-based language-image family locally, ending at agentic-os:dev-base-local, before the release workflow publishes it for both architectures."
  dev-base-check:
    run: bash scripts/dev-base-check.sh
    description: "Run Docker buildx static checks against every language image and the full fan-in image without building or publishing layers."
  dep-bump:
    run: uv run python scripts/dep-bump.py
    description: "Resolve the dev-base Dockerfile's pinned tool versions against upstream and bump them. `ward exec dep-bump -- check` reports drift (exit 1 if stale); `-- plan` emits the stale set as TSV (`--json` for machines); `-- apply --arg UV_VERSION --version X` rewrites one ARG. The scheduled .forgejo/workflows/dep-bump.yml runs this to auto-republish the full image. See docs/dev-base-image.md."
  apply-agentic-os-hooks:
    run: uv run python scripts/apply-agentic-os-hooks.py
    description: "Roll out the canonical pre-commit hook block to every consumer repo under ~/projects/<org>/* (all org dirs). Idempotent."
  apply-agents-pointer:
    run: uv run python scripts/apply-agents-pointer.py
    description: "Inject or refresh the managed workspace-pointer block in each managed repo's AGENTS.md. Org-aware, idempotent. --dry-run to preview."
  apply-shell-links:
    run: uv run python scripts/apply-shell-links.py
    description: "Repoint this host's shell entry symlinks (~/.zshrc, ~/.bashrc, gpg-ssm) to the canonical agentic-os files. Idempotent; pass -- --check to fail on drift."
  update-flight-deck-scoop:
    run: pwsh -NoProfile -File scripts/update-flight-deck-scoop.ps1
    description: "On Windows, update every installed app from the Flight Deck Scoop bucket. Ward self-updates through its audited path; pass -- -WhatIf to preview."
  gen-agents-pointer:
    run: uv run python -m agentic_os.generators.generate_agents_pointer
    description: "Render the managed AGENTS.md workspace-pointer block for an org (--org) or the cwd repo. Single source of truth for the block shape."
  audit-pre-commit-coverage:
    run: uv run python scripts/audit-pre-commit-coverage.py
    description: "Audit every repo under ~/projects/<org>/* for presence of the canonical agentic-os hook block."
  sweep-documentation-layout:
    run: uv run python scripts/sweep-documentation-layout.py
    description: "Read-only sweep: run the documentation-layout check across every workspace git repo and report passing/failing/disabled plus per-repo violation detail."
  sweep-precommit:
    run: uv run python scripts/sweep-precommit.py
    description: "Run the full pre-commit hook set (pre-commit run --all-files) across every workspace git repo and report per-repo Passed/Failed plus failing hook ids. Reverts autofix mutations so trees stay clean."
  pre-commit-all:
    run: pre-commit run --all-files
    description: "Run all pre-commit hooks against all files in the current repo."
  pre-commit-autoupdate:
    run: pre-commit autoupdate
    description: "Bump every third-party hook repo in .pre-commit-config.yaml to its latest tagged rev. Local hooks are unaffected (no rev)."
  pre-commit-code-comments:
    run: pre-commit run code-comments --all-files
    description: "Run only the code-comments hook across all files. Check comment-cap discipline at author time instead of waiting for the full commit gate."
  pre-commit-documentation-layout:
    run: pre-commit run documentation-layout --all-files
    description: "Run only the documentation-layout hook across all files. Check doc placement/size at author time instead of waiting for the full commit gate."
  pre-commit-issue-reference-guard:
    run: pre-commit run issue-reference-guard --all-files --hook-stage manual
    description: "Run only the issue-reference-guard hook across all files. Check issue-reference cleanup at author time instead of waiting for the full commit gate."
  pre-commit-ruff:
    run: pre-commit run ruff-check --all-files
    description: "Run only the ruff-check hook across all files. Check-only (no --fix)."
  pre-commit-shellcheck:
    run: pre-commit run shellcheck --all-files
    description: "Run only the shellcheck hook across all shell files. Check-only."
  pre-commit-shellcheck-files:
    run: pre-commit run shellcheck --files
    description: "Run only the shellcheck hook against paths passed after `--`, for focused validation when unrelated platform-specific files block the all-files hook."
  release:
    run: uv run python scripts/release.py
    description: "Hand-cut an aos-precommit release: bump pyproject + FALLBACK_REV floor, create a signed aos-precommit-v* tag, and push. --bump major|minor|patch to override; --dry-run to preview."
  test:
    run: uv run pytest
    description: "Run the agentic_os Python test suite (pytest)."
  apply-base-claude-settings:
    run: python3 scripts/apply-base-claude-settings.py
    description: "Converge public-safe Claude Code preferences without clobbering local settings."
  gen-repo-pointer-skill:
    run: uv run python -m agentic_os.generators.generate_repo_pointer_skill
    description: "Generate a repo-<name> pointer skill from repository metadata. Pipe `aosguard ops forgejo repo view --repo coilysiren/<name> --json` into it with `<name> --from-json -`, or pass --description/--topic. See docs/features-agents-pointer.md."
  gen-seed-skills:
    run: uv run python -m agentic_os.generators.generate_seed_skills
    description: "Regenerate agentic_os/seed_skills_data.py from seed: frontmatter on the composed coding-<lang> sources. Run after editing a seed block; check-seed-skills-drift fails on staleness. See docs/skill-discipline-authoring-shipping.md."
  gen-caps-reference:
    run: uv run python -m agentic_os.generators.generate_caps_reference
    description: "Regenerate docs/catalog-caps-reference.md from the code-comments / documentation-layout validator constants. Run after changing a cap constant; check-caps-reference-drift fails on staleness. Docs and skills point at this render instead of restating a number."
  gen-context-budget-role-reports:
    run: uv run python -m agentic_os.generators.generate_context_budget_role_reports
    description: "Regenerate the role-centered frontier vs low-context budget reports and their programmatic diffs from the checked-in role-seat YAML snapshots. Pass `-- --check` to report drift without writing. See docs/context-budget-role-seat.md."
  agent-compose:
    run: uv run python -m agentic_os.generators.generate_agent_compose
    description: "Recompose the global agent-context files (~/.config/agent-compose/COMPOSED.<harness>.md) from the declared sources and re-point each harness load-point symlink. No-op without ~/.config/agent-compose/agent-compose.yaml. --dry-run prints the plan; --check fails on drift."
  ssm-path:
    run: uv run python -m agentic_os.pre_commit.check_ssm_path
    description: "Validate SSM parameter paths against the /<org>/<repo>/<tier>/<tail> schema. `ward exec ssm-path -- /coilysiren/backend/write/ts-authkey [more...]`, or `-- --stdin` for one path per line. A CLI validator (paths arrive as args, not repo files), so it is ward-fenced rather than a commit-path hook. See docs/features-release-tooling.md."
  aws-config:
    run: uv run python -m agentic_os.pre_commit.check_aws_config
    description: "Lint ~/.aws/config (or $AWS_CONFIG_FILE) for the [profile default] trap the AWS SDK silently ignores, which surfaces later as a cryptic NoRegion from SSM/S3. No-op when the file is absent. A machine-env check, not repo content, so it is ward-fenced rather than a commit-path hook."
  context-budget:
    run: uv run python -m agentic_os.pre_commit.check_context_budget
    description: "Report the eager startup-context budget each harness loads at session start vs a per-harness token budget, with per-source attribution. `-- --role ROLE --seat SEAT --snapshot FILE` captures a composed role-seat baseline without invoking the seat's agent; add `--compare FILE` after a refactor for a deterministic component delta. `-- --check` exits non-zero when any legacy harness is over budget (for CI). `-- --immediate REPO` / `--peripheral REPO` (repeatable) walk working-dir/reference clones as the immediate/peripheral tiers (tracked-file count, bytes, chars/4 token proxy) for ward's role-aware probe. On-demand by design, not a pre-commit hook. See docs/context-budget.md."
  agents-context-inventory:
    run: uv run python -m agentic_os.agents_context_inventory
    description: "Inventory AGENTS-family sources across the committed substrate and an infrastructure-supplied managed-repo manifest. Emits stable Markdown or JSON with repository provenance, paragraph hashes, clipping candidates, and active role/harness cascades without copying doctrine text. See docs/agents-context-inventory.md."
  freshness:
    run: uv run python -m agentic_os.freshness
    description: "Knowledge-base freshness probe: parse `<!-- freshness: as-of= half-life= -->` provenance markers across tracked docs and grade each fact by age against its half-life horizon. `-- --check` exits non-zero when any fast-decay fact is past its horizon (the loud trigger a scheduled CI job fails on), `-- --lint` checks markers are well-formed. Hermetic, on-demand/scheduled, not a commit-path hook since rot is time-based. See docs/knowledge-base-freshness.md."
  forgejo-actions-logs:
    run: uv run python -m agentic_os.forgejo_actions_logs
    description: "Fetch exact Forgejo 16 Actions log bytes: `ward exec forgejo-actions-logs -- <owner> <repo> <run> [job] [attempt] [--max-bytes N]`. Omit job for a whole-run ZIP. Visible run/job indexes, explicit `id:<n>`, and exact job names are supported. Needs FORGEJO_TOKEN."
  sync-actions-secrets:
    run: uv run python scripts/sync-actions-secrets.py
    description: "Sync Forgejo Actions secrets (Telegram alert creds, release PATs, and package-repository writers) from their SSM sources of truth to the aos + ward + cli-guard repos. Values flow SSM -> Forgejo API in-process, never disk or argv. `FORGEJO_ADMIN_TOKEN` overrides the legacy SSM admin-token source for attended runs. `-- --dry-run` previews the mapping. See docs/release.md."
  remint-ci-release-token:
    run: uv run --with boto3 python scripts/remint-ci-release-token.py
    description: "Remint the two-stage promote PAT on the coilyco-ops bot (write:repository + read:user - without read:user Forgejo drops the release enqueue, ward#1117) and overwrite SSM /forgejo/coilyco-ops/ci-release-token. Values stay in-process. `-- --dry-run` previews. Follow with `ward exec sync-actions-secrets`."
  remint-registry-read-token:
    run: uv run --with boto3 python scripts/remint-registry-read-token.py
    description: "Remint the coilyco-ops read:package token, verify it against the Forgejo registry, and overwrite SSM /forgejo/coilyco-ops/registry-read-token. Values stay in-process. `-- --dry-run` previews."
  agent-id:
    run: uv run python -m agentic_os.agent_id
    description: "Canonical short agent-id generator over the dictatable alphabet (lowercase 2-letter+2-digit, e.g. `ab85`). Bare invocation prints a fresh `secrets`-backed id (`-- -n 5` for more); `-- --seed <s>` prints the deterministic contract id for a seed, `-- --org <forgejo-org>` prints the short container token, `-- --emit-vectors` regenerates agent_id_vectors.json. The cross-repo naming primitive ward and cli-guard's Go port build against. See docs/dictatable-id-alphabet.md."

agent:
  image: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os
  release-channel: release
  workflow: pull-request-and-merge
  verification:
    fixtures:
      - repository: coilyco-flight-deck/ward-qa-fixture
        issue-label: qa-fixture

# Catalog metadata for the cross-repo knowledge graph.
# Schema: ward catalog block tracker.
catalog:
  description: "Personal agentic OS: shell config, terminal config, GPG/SSM tooling, Claude skills, and shared utility scripts symlinked into sibling coilysiren/* repos. Growing beyond just dotfiles into broader personal-OS scope."
  dependsOn: []
