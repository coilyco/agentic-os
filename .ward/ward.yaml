# Per-repo command allowlist. Add verbs here as they emerge.

commands:
  warp:
    run: go run -C warp .
    description: "Establish and verify Kai's Warp config across hosts. `ward exec warp apply` renders all three state layers (repo template, config-dir TOML, SQLite); `ward exec warp doctor` reports drift. See project-a-ward-exec-warp.md."
  aos-say:
    run: go run -C aos-say .
    description: "Speak short status text with the Mac-integrated `aos-say` client. On Darwin it calls `/usr/bin/say` directly, and on other hosts it forwards one JSON request to the configured relay. Use `ward exec aos-say -- relay` for the relay entrypoint."
  aos-say-test:
    run: go test -C aos-say ./...
    description: "Run the `aos-say` Go test suite."
  agent-compat:
    run: uv run python scripts/agent-compat.py
    description: "Run daily unittest smoke checks for local agent harness compatibility. The roster is read live from `ward agents list --json`, so it tracks ward's embedded fleet (Claude, Codex, OpenCode, Goose) instead of a private list; narrow with `-- --harness codex`. Uses unittest's native ok/FAIL/ERROR output and exit code. See docs/agent-compat.md."
  dev-base-build:
    run: uv run python scripts/dev-base-build.py --registry agentic-os --tag dev-base-local build
    description: "Build the split dev-base tier family (fan-out DAG, in topological order) locally under agentic-os:<tier>-dev-base-local (agentic-os:dev-base-local for full) for validating docker/dev-base/<tier>/Dockerfile changes before the release workflow publishes the multi-arch image."
  dep-bump:
    run: uv run python scripts/dep-bump.py
    description: "Resolve the dev-base tier Dockerfiles' pinned tool versions against upstream and bump them. `ward exec dep-bump -- check` reports drift (exit 1 if stale); `-- plan` emits the stale set as TSV (`--json` for machines); `-- apply --arg UV_VERSION --version X` rewrites one ARG. The scheduled .forgejo/workflows/dep-bump.yml runs this to auto-republish the image family. See docs/dev-base-image.md."
  apply-agentic-os-hooks:
    run: uv run python scripts/apply-agentic-os-hooks.py
    description: "Roll out the canonical pre-commit hook block to every consumer repo under ~/projects/<org>/* (all org dirs). Idempotent."
  apply-agents-pointer:
    run: uv run python scripts/apply-agents-pointer.py
    description: "Inject or refresh the managed workspace-pointer block in each managed repo's AGENTS.md. Org-aware, idempotent. --dry-run to preview."
  apply-shell-links:
    run: uv run python scripts/apply-shell-links.py
    description: "Repoint this host's shell entry symlinks (~/.zshrc, ~/.bashrc, gpg-ssm) to the canonical agentic-os files. Idempotent; pass -- --check to fail on drift."
  gen-agents-pointer:
    run: uv run python -m agentic_os.generators.generate_agents_pointer
    description: "Render the managed AGENTS.md workspace-pointer block for an org (--org) or the cwd repo. Single source of truth for the block shape."
  audit-pre-commit-coverage:
    run: uv run python scripts/audit-pre-commit-coverage.py
    description: "Audit every repo under ~/projects/<org>/* for presence of the canonical agentic-os hook block."
  sweep-documentation-layout:
    run: uv run python scripts/sweep-documentation-layout.py
    description: "Read-only sweep: run the documentation-layout check across every workspace git repo and report passing/failing/disabled plus per-repo violation detail."
  sweep-precommit:
    run: uv run python scripts/sweep-precommit.py
    description: "Run the full pre-commit hook set (pre-commit run --all-files) across every workspace git repo and report per-repo Passed/Failed plus failing hook ids. Reverts autofix mutations so trees stay clean."
  pre-commit-all:
    run: pre-commit run --all-files
    description: "Run all pre-commit hooks against all files in the current repo."
  pre-commit-autoupdate:
    run: pre-commit autoupdate
    description: "Bump every third-party hook repo in .pre-commit-config.yaml to its latest tagged rev. Local hooks are unaffected (no rev)."
  pre-commit-code-comments:
    run: pre-commit run code-comments --all-files
    description: "Run only the code-comments hook across all files. Check comment-cap discipline at author time instead of waiting for the full commit gate."
  pre-commit-documentation-layout:
    run: pre-commit run documentation-layout --all-files
    description: "Run only the documentation-layout hook across all files. Check doc placement/size at author time instead of waiting for the full commit gate."
  pre-commit-issue-reference-guard:
    run: pre-commit run issue-reference-guard --all-files --hook-stage manual
    description: "Run only the issue-reference-guard hook across all files. Check issue-reference cleanup at author time instead of waiting for the full commit gate."
  pre-commit-ruff:
    run: pre-commit run ruff-check --all-files
    description: "Run only the ruff-check hook across all files. Check-only (no --fix)."
  pre-commit-shellcheck:
    run: pre-commit run shellcheck --all-files
    description: "Run only the shellcheck hook across all shell files. Check-only."
  release:
    run: uv run python scripts/release.py
    description: "Cut a release: bump pyproject + FALLBACK_REV floor, create signed tag, push (consumer pin is tag-derived). --bump major|minor|patch to override; --dry-run to preview."
  test:
    run: uv run pytest
    description: "Run the agentic_os Python test suite (pytest)."
  gen-repo-pointer-skill:
    run: uv run python -m agentic_os.generators.generate_repo_pointer_skill
    description: "Generate a repo-<name> pointer skill from GitHub metadata. Pipe `ward ops gh repo view coilysiren/<name>` into it with `<name> --from-json -`, or pass --description/--topic. See docs/features-agents-pointer.md."
  gen-seed-skills:
    run: uv run python -m agentic_os.generators.generate_seed_skills
    description: "Regenerate agentic_os/seed_skills_data.py from the seed: frontmatter on the coding-<lang> skills. Run after editing a seed block; check-seed-skills-drift fails on staleness. See docs/skill-discipline-authoring-shipping.md."
  gen-caps-reference:
    run: uv run python -m agentic_os.generators.generate_caps_reference
    description: "Regenerate docs/catalog-caps-reference.md from the code-comments / documentation-layout validator constants. Run after changing a cap constant; check-caps-reference-drift fails on staleness. Docs and skills point at this render instead of restating a number."
  agent-compose:
    run: uv run python -m agentic_os.generators.generate_agent_compose
    description: "Recompose the global agent-context files (~/.config/agent-compose/COMPOSED.<harness>.md) from the declared sources and re-point each harness load-point symlink. No-op without ~/.config/agent-compose/agent-compose.yaml. --dry-run prints the plan; --check fails on drift."
  ssm-path:
    run: uv run python -m agentic_os.pre_commit.check_ssm_path
    description: "Validate SSM parameter paths against the /<org>/<repo>/<tier>/<tail> schema. `ward exec ssm-path -- /coilysiren/backend/write/ts-authkey [more...]`, or `-- --stdin` for one path per line. A CLI validator (paths arrive as args, not repo files), so it is ward-fenced rather than a commit-path hook. See docs/features-release-tooling.md."
  aws-config:
    run: uv run python -m agentic_os.pre_commit.check_aws_config
    description: "Lint ~/.aws/config (or $AWS_CONFIG_FILE) for the [profile default] trap the AWS SDK silently ignores, which surfaces later as a cryptic NoRegion from SSM/S3. No-op when the file is absent. A machine-env check, not repo content, so it is ward-fenced rather than a commit-path hook."
  context-budget:
    run: uv run python -m agentic_os.pre_commit.check_context_budget
    description: "Report the eager startup-context budget each harness loads at session start vs a per-harness token budget, with per-source attribution. `-- --check` exits non-zero when any harness is over budget (for CI). `-- --immediate REPO` / `--peripheral REPO` (repeatable) walk working-dir/reference clones as the immediate/peripheral tiers (tracked-file count, bytes, chars/4 token proxy) for ward's role-aware probe. On-demand by design, not a pre-commit hook. See docs/context-budget.md."
  gen-ward-ops-reference:
    run: bash scripts/gen-ward-ops-reference.sh
    description: "Regenerate docs/ward-ops-forgejo-reference.md from `ward ops forgejo describe` with a provenance header (as-of date + ward version). The committed render keeps operator-verb names greppable off-disk so a cold agent never guesses the name. Run at converge time or when ward-kdl's forgejo surface changes."
  freshness:
    run: uv run python -m agentic_os.freshness
    description: "Knowledge-base freshness probe: parse `<!-- freshness: as-of= half-life= -->` provenance markers across tracked docs and grade each fact by age against its half-life horizon. `-- --check` exits non-zero when any fast-decay fact is past its horizon (the loud trigger a scheduled CI job fails on), `-- --lint` checks markers are well-formed. Hermetic, on-demand/scheduled, not a commit-path hook since rot is time-based. See docs/knowledge-base-freshness.md."
  ship-tool-failures:
    run: uv run python -m agentic_os.tool_failures.ship
    description: "Drain the tool-use failure-record buffer (~/.cache/agentic-os/tool-failures/<repo>.jsonl) to GlitchTip: gate on genuine failures, fingerprint-group, and emit one Sentry-protocol envelope per failure past a per-file watermark (idempotent). DSN from SSM (/sentry-dsn/tool-failures), fail-soft when absent so the buffer keeps accumulating. Producer-agnostic, out-of-band (timer / SessionEnd hook), never a hot path. `-- --dry-run` previews counts without a DSN or POST, `-- --repo <slug>` narrows. See docs/tool-failures-shipper.md, SSM.md."
  forgejo-actions-logs:
    run: uv run python -m agentic_os.forgejo_actions_logs
    description: "Stream a Forgejo Actions job log: `ward exec forgejo-actions-logs -- <owner> <repo> <run_index> <job_index> [attempt]` (indexes as shown in the run URL). Needs FORGEJO_TOKEN. Speaks the UI log-cursor route since the API logs route 404s on Forgejo 15 (aos#476); logs for older runs may already be purged (infrastructure#545)."
  sync-actions-secrets:
    run: uv run python scripts/sync-actions-secrets.py
    description: "Sync Forgejo Actions secrets (Telegram alert creds, CI_RELEASE_TOKEN) from their SSM sources of truth to the aos + ward + cli-guard repos. Values flow SSM -> Forgejo API in-process, never disk or argv. `-- --dry-run` previews the mapping. See docs/release.md."
  remint-ci-release-token:
    run: uv run --with boto3 python scripts/remint-ci-release-token.py
    description: "Remint the two-stage promote PAT on the coilyco-ops bot (write:repository + read:user - without read:user Forgejo drops the release enqueue, ward#1117) and overwrite SSM /forgejo/ci-release-token. Values stay in-process. `-- --dry-run` previews. Follow with `ward exec sync-actions-secrets`."
  agent-id:
    run: uv run python -m agentic_os.agent_id
    description: "Canonical short agent-id generator over the dictatable alphabet (lowercase 2-letter+2-digit, e.g. `ab85`). Bare invocation prints a fresh `secrets`-backed id (`-- -n 5` for more); `-- --seed <s>` prints the deterministic contract id for a seed, `-- --org <forgejo-org>` prints the short container token, `-- --emit-vectors` regenerates agent_id_vectors.json. The cross-repo naming primitive ward and cli-guard's Go port build against. See docs/dictatable-id-alphabet.md."

# Catalog metadata for the cross-repo knowledge graph.
# Schema: ward catalog block tracker.
catalog:
  description: "Personal agentic OS: shell config, terminal config, GPG/SSM tooling, Claude skills, and shared utility scripts symlinked into sibling coilysiren/* repos. Growing beyond just dotfiles into broader personal-OS scope."
  dependsOn: []
