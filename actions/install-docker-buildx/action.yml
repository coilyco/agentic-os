name: Install Docker CLI and buildx plugin
description: Install the Docker CLI and pinned buildx plugin with bounded download retries.

inputs:
  buildx-version:
    description: Docker buildx plugin version to install.
    required: true

runs:
  using: composite
  steps:
    - name: Install docker CLI + buildx plugin
      shell: bash
      env:
        BUILDX_VERSION: ${{ inputs.buildx-version }}
      run: |
        set -euo pipefail
        retry_attempts=5
        retry_delay_seconds=2
        docker_cli_ver=$(curl --retry "$retry_attempts" --retry-all-errors --retry-delay "$retry_delay_seconds" -fsSL https://download.docker.com/linux/static/stable/x86_64/ \
          | grep -oE 'docker-[0-9]+\.[0-9]+\.[0-9]+\.tgz' | sort -V | tail -1 \
          | sed -E 's/^docker-(.*)\.tgz$/\1/')
        curl --retry "$retry_attempts" --retry-all-errors --retry-delay "$retry_delay_seconds" -fsSL "https://download.docker.com/linux/static/stable/x86_64/docker-${docker_cli_ver}.tgz" \
          | tar -xz -C /tmp
        install /tmp/docker/docker /usr/local/bin/docker
        mkdir -p ~/.docker/cli-plugins
        curl --retry "$retry_attempts" --retry-all-errors --retry-delay "$retry_delay_seconds" -fsSL "https://github.com/docker/buildx/releases/download/${BUILDX_VERSION}/buildx-${BUILDX_VERSION}.linux-amd64" \
          -o ~/.docker/cli-plugins/docker-buildx
        chmod +x ~/.docker/cli-plugins/docker-buildx
        docker buildx version
        docker --version
