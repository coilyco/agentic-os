name: "Upload a Release asset"
description: |
  POST a single file as an asset on an existing Release, on Forgejo or
  GitHub (the `host` input). Idempotent: if an asset with the same name is
  already attached, it is deleted first and replaced. Sibling to
  `create-release`. Contract: docs/release.md.

inputs:
  forgejo_token:
    description: "Forgejo API token, kept for existing Forgejo callers. Defaults to the job token, which also covers GitHub when token is unset."
    required: false
    default: ${{ github.token }}
  forgejo_base_url:
    description: "Forgejo base URL. Used only when host resolves to forgejo."
    required: false
    default: "https://forgejo.coilysiren.me"
  token:
    description: "API token. Wins over forgejo_token when set. On GitHub pass a GitHub App token when a tag, release or push must start downstream workflows, since GITHUB_TOKEN events start none, or when the target repo is not the running one."
    required: false
    default: ""
  host:
    description: "API to call: auto|github|forgejo. auto reads the runner's server URL, github.com means GitHub and anything else Forgejo."
    required: false
    default: "auto"
  api_url:
    description: "API base URL override, for tests and other servers. Default https://api.github.com on GitHub, forgejo_base_url plus /api/v1 on Forgejo."
    required: false
    default: ""
  repo:
    description: "owner/name."
    required: false
    default: ${{ github.repository }}
  release_id:
    description: "Release id from the create-release action."
    required: true
  uploads_url:
    description: "GitHub uploads host override. Default https://uploads.github.com, or api_url when that is set."
    required: false
    default: ""
  file:
    description: "Path to the file to upload."
    required: true
  name:
    description: "Asset name as it should appear on the release. Defaults to basename of file."
    required: false
    default: ""

outputs:
  asset_url:
    description: "Browser-download URL for the uploaded asset."
    value: ${{ steps.upload.outputs.asset_url }}

runs:
  using: "composite"
  steps:
    - id: upload
      shell: bash
      env:
        FORGEJO_TOKEN: ${{ inputs.forgejo_token }}
        FORGEJO_BASE_URL: ${{ inputs.forgejo_base_url }}
        RELEASE_TOKEN_INPUT: ${{ inputs.token }}
        RELEASE_HOST_INPUT: ${{ inputs.host }}
        RELEASE_API_URL: ${{ inputs.api_url }}
        RELEASE_UPLOADS_URL: ${{ inputs.uploads_url }}
        REPO: ${{ inputs.repo }}
        RELEASE_ID: ${{ inputs.release_id }}
        FILE: ${{ inputs.file }}
        NAME: ${{ inputs.name }}
      run: bash "${GITHUB_ACTION_PATH}/run.sh"
