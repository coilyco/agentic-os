name: "Upload a Release asset"
description: |
  POST a single file as an asset on an existing GitHub Release. Idempotent: if
  an asset with the same name is already attached, it is deleted first and
  replaced. Sibling to `create-release`. Contract: docs/release.md.

inputs:
  token:
    description: "API token. Defaults to the job token. Pass a GitHub App token when a tag, release or push must start downstream workflows, since GITHUB_TOKEN events start none, or when the target repo is not the running one."
    required: false
    default: ${{ github.token }}
  api_url:
    description: "API base URL override, for tests and other servers. Default https://api.github.com."
    required: false
    default: ""
  repo:
    description: "owner/name."
    required: false
    default: ${{ github.repository }}
  release_id:
    description: "Release id from the create-release action."
    required: true
  uploads_url:
    description: "GitHub uploads host override. Default https://uploads.github.com, or api_url when that is set."
    required: false
    default: ""
  file:
    description: "Path to the file to upload."
    required: true
  name:
    description: "Asset name as it should appear on the release. Defaults to basename of file."
    required: false
    default: ""

outputs:
  asset_url:
    description: "Browser-download URL for the uploaded asset."
    value: ${{ steps.upload.outputs.asset_url }}

runs:
  using: "composite"
  steps:
    - id: upload
      shell: bash
      env:
        RELEASE_TOKEN_INPUT: ${{ inputs.token }}
        RELEASE_API_URL: ${{ inputs.api_url }}
        RELEASE_UPLOADS_URL: ${{ inputs.uploads_url }}
        REPO: ${{ inputs.repo }}
        RELEASE_ID: ${{ inputs.release_id }}
        FILE: ${{ inputs.file }}
        NAME: ${{ inputs.name }}
      run: bash "${GITHUB_ACTION_PATH}/run.sh"
