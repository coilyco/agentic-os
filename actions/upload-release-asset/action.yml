name: "Upload a forgejo Release asset"
description: |
  POST a single file as an asset on an existing forgejo Release. Idempotent:
  if an asset with the same name is already attached, it is deleted first
  and replaced. Sibling to `create-release` for the forgejo-canonical
  pipeline.

inputs:
  forgejo_token:
    description: "Forgejo API token. Defaults to the auto-issued job token."
    required: false
    default: ${{ github.token }}
  forgejo_base_url:
    description: "Forgejo base URL."
    required: false
    default: "https://forgejo.coilysiren.me"
  repo:
    description: "owner/name on forgejo."
    required: false
    default: ${{ github.repository }}
  release_id:
    description: "Forgejo release id from the create-release action."
    required: true
  file:
    description: "Path to the file to upload."
    required: true
  name:
    description: "Asset name as it should appear on the release. Defaults to basename of file."
    required: false
    default: ""

outputs:
  asset_url:
    description: "Browser-download URL for the uploaded asset."
    value: ${{ steps.upload.outputs.asset_url }}

runs:
  using: "composite"
  steps:
    - id: upload
      shell: bash
      env:
        FORGEJO_TOKEN: ${{ inputs.forgejo_token }}
        FORGEJO_BASE_URL: ${{ inputs.forgejo_base_url }}
        REPO: ${{ inputs.repo }}
        RELEASE_ID: ${{ inputs.release_id }}
        FILE: ${{ inputs.file }}
        NAME: ${{ inputs.name }}
      run: bash "${GITHUB_ACTION_PATH}/run.sh"
