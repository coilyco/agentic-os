name: "Telegram CI failure alert"
description: |
  Post a Telegram alert for a failing CI job on main. The caller passes the
  bot token and red chat id as secrets; the action formats the job context and
  sends one message without leaking credentials.

inputs:
  bot-token:
    description: "Telegram bot token."
    required: true
  chat-id:
    description: "Telegram chat id for the red channel."
    required: true
  repo:
    description: "owner/name that failed."
    required: false
    default: ${{ github.repository }}
  workflow:
    description: "Workflow name."
    required: false
    default: ${{ github.workflow }}
  job:
    description: "Job id or name."
    required: false
    default: ${{ github.job }}
  ref:
    description: "Git ref for the run."
    required: false
    default: ${{ github.ref }}
  sha:
    description: "Commit SHA for the run."
    required: false
    default: ${{ github.sha }}
  run-url:
    description: "URL of the failed run."
    required: false
    default: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  api-base:
    description: "Telegram API base URL."
    required: false
    default: "https://api.telegram.org"
  dry-run:
    description: "Print the message instead of posting it."
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - shell: bash
      env:
        BOT_TOKEN: ${{ inputs.bot-token }}
        CHAT_ID: ${{ inputs.chat-id }}
        REPO: ${{ inputs.repo }}
        WORKFLOW: ${{ inputs.workflow }}
        JOB: ${{ inputs.job }}
        REF: ${{ inputs.ref }}
        SHA: ${{ inputs.sha }}
        RUN_URL: ${{ inputs.run-url }}
        API_BASE: ${{ inputs.api-base }}
        DRY_RUN: ${{ inputs.dry-run }}
      run: python3 "${GITHUB_ACTION_PATH}/telegram_alert.py"
