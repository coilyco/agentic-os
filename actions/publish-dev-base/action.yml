name: "Publish one dev-base build artifact"
description: |
  Build and push one multi-arch language payload or the full image. Promotion
  is restricted to the already-pushed full-image draft.

  Promote verifies the draft by its source tag and only then moves the version
  tag and the release aliases, so a verification failure leaves the moving
  aliases pointing at the last image that passed. Promotion is the final step,
  which is what makes the job safe to retry. Build mode verifies the draft it
  just pushed, because the image cannot be verified before it exists, and the
  draft tag is not a fleet alias.

  Build mode installs binfmt as part of the buildx builder setup. Promote mode
  skips that setup, so it inherits no handler from a build-mode run. The
  full-tier verification runs one container per published platform in both
  modes, so promote installs binfmt on its own before that step. See
  docs/dev-base-image.md.

  Verify mode reads only: it asserts that `tag` and any aliases resolve to the
  same digest as `source-tag`, and fails when they do not. Promote mode runs the
  same assertion after it moves the tags, so a promotion that silently did not
  happen is caught where it happened rather than believed. A caller runs verify
  after a workflow it does not control, which is how a reusable-workflow call
  that reported success without executing is caught. See agentic-os#1032.

  A skipped job is not this case and needs no backstop, since the job is
  reported as skipped. The failure verify exists for is a reusable-workflow call
  that reports green without executing.

  Callers act on that retry-safety: dev-base-publish gives each payload one
  bounded retry, since the full job needs the whole matrix green in one run and
  a single transient used to skip the release for a thirty-minute manual
  rebuild of all five payloads. Attempt one carries `continue-on-error` so a
  transient does not fail the job, the retry carries none so a real defect
  still fails loudly, and there is never a third: that turns a defect into a
  slow failure. The checkpoint step below skips a payload that already landed,
  so a retry after a late failure is cheap. See agentic-os#987.

inputs:
  tier:
    description: "Build artifact tier. Only full is promotable."
    required: true
  tag:
    description: "Draft or release tag to stamp onto the selected artifact."
    required: true
  alias:
    description: "Optional moving alias tag pushed alongside the stamped tag."
    required: false
    default: ""
  extra-aliases:
    description: "Optional whitespace-separated alias tags appended after alias."
    required: false
    default: ""
  mode:
    description: "Operation mode: build pushes, promote retags source-tag, verify asserts tags resolve to source-tag."
    required: false
    default: "build"
  source-tag:
    description: "Existing source tag used by promote mode."
    required: false
    default: ""
  registry-token:
    description: "Registry token. The workflow GITHUB_TOKEN, with packages: write, logs in to GHCR."
    required: true
  image-base:
    description: "Registry image base."
    required: false
    default: "ghcr.io/coilyco/agentic-os"
  platforms:
    description: "Platforms for the buildx publish."
    required: false
    default: "linux/amd64,linux/arm64"
  build-timeout:
    description: "Inner timeout(1) guard around the image build."
    required: false
    default: "110m"
  uv-version:
    description: "uv version installed on the bare runner."
    required: false
    default: "0.12.0"
  buildx-version:
    description: "docker buildx plugin version installed on the bare runner."
    required: false
    default: "v0.34.1"

runs:
  using: "composite"
  steps:
    - name: Install uv
      shell: bash
      env:
        UV_VERSION: ${{ inputs.uv-version }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/install-uv.sh"

    - name: Install docker CLI + buildx plugin
      shell: bash
      env:
        BUILDX_VERSION: ${{ inputs.buildx-version }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/install-docker.sh"

    - name: Resolve docker host
      shell: bash
      run: bash "${GITHUB_ACTION_PATH}/scripts/resolve-docker-host.sh"

    - name: Registry login
      shell: bash
      env:
        REGISTRY_TOKEN: ${{ inputs.registry-token }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/registry-login.sh"

    - name: Check whether the image already landed
      id: checkpoint
      if: ${{ inputs.mode != 'verify' }}
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        TIER: ${{ inputs.tier }}
        TAG: ${{ inputs.tag }}
        ALIAS: ${{ inputs.alias }}
        EXTRA_ALIASES: ${{ inputs.extra-aliases }}
        SOURCE_TAG: ${{ inputs.source-tag }}
        IMAGE_BASE: ${{ inputs.image-base }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/checkpoint.sh"

    - name: Set up qemu + reuse the persistent buildx builder
      if: ${{ inputs.mode == 'build' && steps.checkpoint.outputs.skip_publish != 'true' }}
      shell: bash
      run: bash "${GITHUB_ACTION_PATH}/scripts/setup-builder.sh"

    - name: Install binfmt so promote can verify the foreign architecture
      if: ${{ inputs.tier == 'full' && inputs.mode == 'promote' }}
      shell: bash
      run: docker run --privileged --rm tonistiigi/binfmt --install all

    - name: Verify the promotion source before the release tags move
      if: ${{ inputs.tier == 'full' && inputs.mode == 'promote' }}
      shell: bash
      env:
        IMAGE_BASE: ${{ inputs.image-base }}
        TAG: ${{ inputs.source-tag }}
        PLATFORMS: ${{ inputs.platforms }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/verify-full.sh"

    - name: Publish or promote the image
      if: ${{ inputs.mode != 'verify' && steps.checkpoint.outputs.skip_publish != 'true' }}
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        TIER: ${{ inputs.tier }}
        TAG: ${{ inputs.tag }}
        ALIAS: ${{ inputs.alias }}
        EXTRA_ALIASES: ${{ inputs.extra-aliases }}
        SOURCE_TAG: ${{ inputs.source-tag }}
        IMAGE_BASE: ${{ inputs.image-base }}
        PLATFORMS: ${{ inputs.platforms }}
        BUILD_TIMEOUT: ${{ inputs.build-timeout }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/publish-image.sh"

    - name: Verify the full development surface on both architectures
      if: ${{ inputs.tier == 'full' && inputs.mode == 'build' }}
      shell: bash
      env:
        IMAGE_BASE: ${{ inputs.image-base }}
        TAG: ${{ inputs.tag }}
        PLATFORMS: ${{ inputs.platforms }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/verify-full.sh"

    - name: Assert the promoted tags resolve to the source digest
      if: ${{ inputs.mode == 'promote' || inputs.mode == 'verify' }}
      shell: bash
      env:
        TIER: ${{ inputs.tier }}
        TAG: ${{ inputs.tag }}
        ALIAS: ${{ inputs.alias }}
        EXTRA_ALIASES: ${{ inputs.extra-aliases }}
        SOURCE_TAG: ${{ inputs.source-tag }}
        IMAGE_BASE: ${{ inputs.image-base }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/verify-alias.sh"
