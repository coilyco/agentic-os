name: "Bump a Homebrew Formula via forgejo Contents API"
description: |
  Rewrite the `url "..."` line of a Homebrew Formula to point at the new
  tag + revision and PUT the result back via forgejo's Contents API. The
  canonical brew clone URL is forgejo, and the bump commit lands on the
  same forgejo repo that emitted the release - no cross-host writes.

inputs:
  forgejo_token:
    description: "Forgejo API token. Defaults to the auto-issued job token."
    required: false
    default: ${{ github.token }}
  forgejo_base_url:
    description: "Forgejo base URL."
    required: false
    default: "https://forgejo.coilysiren.me"
  repo:
    description: "owner/name on forgejo. The Formula lives in this repo."
    required: false
    default: ${{ github.repository }}
  formula_path:
    description: "Path to the Formula .rb file in the repo (e.g. Formula/ward.rb)."
    required: true
  tag:
    description: "Git tag the Formula should pin (e.g. v2.37.0)."
    required: true
  revision:
    description: "Commit SHA the tag points at."
    required: true
  url_template:
    description: |
      Template for the `url "..."` line that gets written. {REPO} is
      substituted with the `repo` input. Default produces the forgejo
      HTTPS clone URL.
    required: false
    default: 'https://forgejo.coilysiren.me/{REPO}.git'
  branch:
    description: "Branch the Formula bump lands on."
    required: false
    default: "main"
  message:
    description: "Commit message. {TAG} is substituted with the tag input."
    required: false
    default: "chore(formula): bump to {TAG} [skip ci]"

runs:
  using: "composite"
  steps:
    - id: bump
      shell: bash
      env:
        FORGEJO_TOKEN: ${{ inputs.forgejo_token }}
        FORGEJO_BASE_URL: ${{ inputs.forgejo_base_url }}
        REPO: ${{ inputs.repo }}
        FORMULA_PATH: ${{ inputs.formula_path }}
        TAG: ${{ inputs.tag }}
        NEW_REVISION: ${{ inputs.revision }}
        URL_TEMPLATE: ${{ inputs.url_template }}
        BRANCH: ${{ inputs.branch }}
        MSG_TEMPLATE: ${{ inputs.message }}
      run: bash "${GITHUB_ACTION_PATH}/run.sh"
