name: "Bump a Homebrew Formula via the Contents API"
description: |
  Rewrite the `url "..."` line of a Homebrew Formula to point at the new
  tag + revision and PUT the result back via the GitHub Contents API. The bump
  commit lands on `repo`, which is usually the tap, not the repo running the
  workflow, so pass a GitHub App token with contents:write on the tap as
  `token`. Contract: docs/release.md.

inputs:
  token:
    description: "API token. Defaults to the job token. Pass a GitHub App token when a tag, release or push must start downstream workflows, since GITHUB_TOKEN events start none, or when the target repo is not the running one."
    required: false
    default: ${{ github.token }}
  api_url:
    description: "API base URL override, for tests and other servers. Default https://api.github.com."
    required: false
    default: ""
  repo:
    description: "owner/name. The Formula lives in this repo."
    required: false
    default: ${{ github.repository }}
  formula_path:
    description: "Path to the Formula .rb file in the repo (e.g. Formula/ward.rb)."
    required: true
  tag:
    description: "Git tag the Formula should pin (e.g. v2.37.0)."
    required: true
  revision:
    description: "Commit SHA the tag points at."
    required: true
  url_template:
    description: |
      Template for the `url "..."` line that gets written. {REPO} is
      substituted with the `repo` input. Empty (the default) writes the
      GitHub HTTPS clone URL.
    required: false
    default: ''
  branch:
    description: "Branch the Formula bump lands on."
    required: false
    default: "main"
  message:
    description: "Commit message. {TAG} is substituted with the tag input."
    required: false
    default: "chore(formula): bump to {TAG} [skip ci]"

runs:
  using: "composite"
  steps:
    - id: bump
      shell: bash
      env:
        RELEASE_TOKEN_INPUT: ${{ inputs.token }}
        RELEASE_API_URL: ${{ inputs.api_url }}
        REPO: ${{ inputs.repo }}
        FORMULA_PATH: ${{ inputs.formula_path }}
        TAG: ${{ inputs.tag }}
        NEW_REVISION: ${{ inputs.revision }}
        URL_TEMPLATE: ${{ inputs.url_template }}
        BRANCH: ${{ inputs.branch }}
        MSG_TEMPLATE: ${{ inputs.message }}
      run: bash "${GITHUB_ACTION_PATH}/run.sh"
