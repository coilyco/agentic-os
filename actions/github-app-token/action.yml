name: "Mint a coilyco-ops App token"
description: |
  Decode the base64 private key kept as an Actions secret and mint a
  short-lived installation token for the listed repositories. Use it where a
  GITHUB_TOKEN cannot do the job: a tag or branch push that must start a
  workflow, or a write to another repo such as a tap. The token is revoked when
  the job ends. Contract: docs/release.md.

inputs:
  app_id:
    description: "GitHub App id, from the COILYCO_OPS_APP_ID secret."
    required: true
  private_key_base64:
    description: "Base64 of the App private key PEM, from the COILYCO_OPS_APP_PRIVATE_KEY_BASE64 secret."
    required: true
  owner:
    description: "Account the App is installed on."
    required: false
    default: ${{ github.repository_owner }}
  repositories:
    description: "Comma-separated repository names under owner. Required, so a token is never granted every repo of the installation."
    required: true
  workflows:
    description: "Set to write when the token pushes commits that change .github/workflows files, which contents:write alone is refused."
    required: false
    default: ""

outputs:
  token:
    description: "Installation token, scoped to repositories with contents:write."
    value: ${{ steps.app.outputs.token }}

runs:
  using: "composite"
  steps:
    - id: key
      shell: bash
      env:
        APP_KEY_B64: ${{ inputs.private_key_base64 }}
      run: bash "${GITHUB_ACTION_PATH}/decode-key.sh"
    - id: app
      uses: actions/create-github-app-token@v3.3.0
      with:
        app-id: ${{ inputs.app_id }}
        private-key: ${{ steps.key.outputs.pem }}
        owner: ${{ inputs.owner }}
        repositories: ${{ inputs.repositories }}
        permission-contents: write
        permission-workflows: ${{ inputs.workflows }}
