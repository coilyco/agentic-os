name: "Validate the dev-base build graph"
description: |
  Build the complete single-architecture payload fan-in graph from its declarative
  Docker Bake graph. This action has no registry credential and never pushes.

inputs:
  tag:
    description: "Throwaway local tag for this validation run."
    required: true
  platform:
    description: "Single local platform to build and verify."
    required: false
    default: "linux/amd64"
  cache-max:
    description: "Maximum persistent Buildx cache retained after validation."
    required: false
    default: "20gb"
  build-timeout:
    description: "Inner timeout around the image build."
    required: false
    default: "110m"
  buildx-version:
    description: "docker buildx plugin version installed on the bare runner."
    required: false
    default: "v0.34.1"
  treehouse-read-token:
    description: "Read token for the private agent-compose release, from actions/dev-base-read-token."
    required: true

runs:
  using: "composite"
  steps:
    - name: Install docker CLI + buildx plugin
      shell: bash
      env:
        BUILDX_VERSION: ${{ inputs.buildx-version }}
      run: bash "${GITHUB_ACTION_PATH}/../publish-dev-base/scripts/install-docker.sh"

    - name: Resolve docker host
      shell: bash
      run: bash "${GITHUB_ACTION_PATH}/../publish-dev-base/scripts/resolve-docker-host.sh"

    - name: Reuse the single-architecture validation builder
      shell: bash
      env:
        BUILDER_NAME: aos-pr-builder
        INSTALL_BINFMT: "false"
      run: bash "${GITHUB_ACTION_PATH}/../publish-dev-base/scripts/setup-builder.sh"

    - name: Build the complete payload fan-in graph without publishing
      shell: bash
      env:
        BUILD_TIMEOUT: ${{ inputs.build-timeout }}
        PLATFORM: ${{ inputs.platform }}
        TAG: ${{ inputs.tag }}
        TREEHOUSE_READ_TOKEN: ${{ inputs.treehouse-read-token }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/build.sh"

    - name: Verify the local full development surface
      shell: bash
      env:
        IMAGE_BASE: agentic-os
        TAG: ${{ inputs.tag }}
        PLATFORMS: ${{ inputs.platform }}
      run: bash "${GITHUB_ACTION_PATH}/../publish-dev-base/scripts/verify-full.sh"

    - name: Bound the validation cache and remove throwaway tags
      if: ${{ always() }}
      shell: bash
      env:
        BUILDER_NAME: aos-pr-builder
        CACHE_MAX: ${{ inputs.cache-max }}
        TAG: ${{ inputs.tag }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/cleanup.sh"
