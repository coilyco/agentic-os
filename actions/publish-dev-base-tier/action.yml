name: "Publish one dev-base tier"
description: |
  Build and push a single dev-base tier as one multi-arch image, or retag an
  already-pushed draft tier into the release tags. Extracted from the old
  monolithic publish-dev-base job (aos#491) so workflows can run one job per
  tier with `needs:` expressing the real tier DAG: a flake in one tier costs
  that tier and its dependents, never the whole family. The base and graft
  tiers this tier consumes must already be pushed under the same tag by the
  upstream jobs. scripts/dev-base-build.py resolves their refs from the folder
  layout.

inputs:
  tier:
    description: "Tier folder name under docker/dev-base (core, lang-node, ...)."
    required: true
  tag:
    description: "Release tag to stamp onto the tier image."
    required: true
  alias:
    description: "Optional moving alias tag pushed alongside the stamped tag."
    required: false
    default: ""
  extra-aliases:
    description: "Optional whitespace-separated alias tags appended after alias."
    required: false
    default: ""
  mode:
    description: "Operation mode: build pushes a tier, promote retags source-tag."
    required: false
    default: "build"
  source-tag:
    description: "Existing source tag used by promote mode."
    required: false
    default: ""
  registry-token:
    description: "Forgejo PAT with write:package for the registry login."
    required: true
  image-base:
    description: "Registry/image family base."
    required: false
    default: "forgejo.coilysiren.me/coilyco-flight-deck/agentic-os"
  platforms:
    description: "Platforms for the buildx publish."
    required: false
    default: "linux/amd64,linux/arm64"
  build-timeout:
    description: "Inner timeout(1) guard around the tier build."
    required: false
    default: "110m"
  uv-version:
    description: "uv version installed on the bare runner."
    required: false
    default: "0.11.26"
  buildx-version:
    description: "docker buildx plugin version installed on the bare runner."
    required: false
    default: "v0.34.1"

runs:
  using: "composite"
  steps:
    - name: Install uv
      shell: bash
      env:
        UV_VERSION: ${{ inputs.uv-version }}
      run: |
        set -euo pipefail
        # The publish jobs still run on the bare docker runner, so uv stays
        # job-local here even though the image family itself also ships it.
        curl --retry 5 --retry-all-errors --retry-delay 2 -LsSf \
          "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        export PATH="$HOME/.local/bin:$PATH"
        uv --version

    - name: Install docker CLI + buildx plugin
      shell: bash
      env:
        BUILDX_VERSION: ${{ inputs.buildx-version }}
      run: |
        set -euo pipefail
        # Keep the buildx bootstrap here. dev-base does not yet carry a safe
        # Docker daemon/buildx stack for the publish jobs.
        docker_cli_ver=$(curl -fsSL https://download.docker.com/linux/static/stable/x86_64/ \
          | grep -oE 'docker-[0-9]+\.[0-9]+\.[0-9]+\.tgz' | sort -V | tail -1 \
          | sed -E 's/^docker-(.*)\.tgz$/\1/')
        curl -fsSL "https://download.docker.com/linux/static/stable/x86_64/docker-${docker_cli_ver}.tgz" \
          | tar -xz -C /tmp
        install /tmp/docker/docker /usr/local/bin/docker
        mkdir -p ~/.docker/cli-plugins
        curl -fsSL "https://github.com/docker/buildx/releases/download/${BUILDX_VERSION}/buildx-${BUILDX_VERSION}.linux-amd64" \
          -o ~/.docker/cli-plugins/docker-buildx
        chmod +x ~/.docker/cli-plugins/docker-buildx
        docker buildx version
        docker --version

    - name: Resolve docker host
      shell: bash
      run: |
        set -euo pipefail
        gw=$(node -e "const fs=require('fs');const l=(fs.readFileSync('/proc/net/route','utf8').split('\n').find(x=>x.split('\t')[1]==='00000000'))||'';const h=l.split(/\s+/)[2]||'';if(h){console.log(h.match(/../g).reverse().map(x=>parseInt(x,16)).join('.'))}" || true)
        for h in "tcp://${gw}:2375" "${DOCKER_HOST:-}" tcp://localhost:2375 unix:///var/run/docker.sock; do
          [ -z "$h" ] && continue
          [ "$h" = "tcp://:2375" ] && continue
          if docker -H "$h" info >/dev/null 2>&1; then
            echo "docker daemon reachable at $h"
            echo "DOCKER_HOST=$h" >> "$GITHUB_ENV"
            echo "selected DOCKER_HOST=$h"
            docker -H "$h" version
            exit 0
          fi
          echo "no docker daemon at $h"
        done
        echo "no reachable docker daemon" >&2
        exit 1

    - name: Registry login
      shell: bash
      env:
        REGISTRY_TOKEN: ${{ inputs.registry-token }}
      run: |
        set -euo pipefail
        retry() {
          local attempts="$1"
          shift
          local delay=2
          local n=1
          while true; do
            if "$@"; then
              return 0
            fi
            if [ "$n" -ge "$attempts" ]; then
              return 1
            fi
            echo "registry login failed, retrying in ${delay}s" >&2
            sleep "$delay"
            n=$((n + 1))
            delay=$((delay * 2))
          done
        }
        if [ -z "${REGISTRY_TOKEN:-}" ]; then
          echo "::error::REGISTRY_TOKEN not set. Mint a forgejo PAT with write:package and add it as an Actions secret. See docs/dev-base-image.md." >&2
          exit 1
        fi
        retry 4 sh -c 'printf "%s" "$REGISTRY_TOKEN" | docker login forgejo.coilysiren.me -u coilyco-ops --password-stdin'

    - name: Check whether the tier already landed
      id: checkpoint
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        TIER: ${{ inputs.tier }}
        TAG: ${{ inputs.tag }}
        ALIAS: ${{ inputs.alias }}
        EXTRA_ALIASES: ${{ inputs.extra-aliases }}
        SOURCE_TAG: ${{ inputs.source-tag }}
        IMAGE_BASE: ${{ inputs.image-base }}
      run: |
        set -euo pipefail
        alias_args=()
        for alias in ${ALIAS:-} ${EXTRA_ALIASES:-}; do
          [ -n "${alias}" ] && alias_args+=(--alias "${alias}")
        done
        source_args=()
        if [ -n "${SOURCE_TAG:-}" ]; then
          source_args+=(--source-tag "${SOURCE_TAG}")
        fi
        if uv run python scripts/dev-base-build.py \
          --registry "${IMAGE_BASE}" \
          --tag "${TAG}" \
          "${alias_args[@]}" \
          check \
          --mode "${MODE}" \
          --tier "${TIER}" \
          "${source_args[@]}"
        then
          echo "skip_publish=true" >> "$GITHUB_OUTPUT"
        else
          rc=$?
          if [ "$rc" -ne 1 ]; then
            exit "$rc"
          fi
          echo "skip_publish=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Set up qemu + reuse the persistent buildx builder
      if: ${{ inputs.mode == 'build' && steps.checkpoint.outputs.skip_publish != 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        echo "buildx before bootstrap"
        docker buildx ls
        docker run --privileged --rm tonistiigi/binfmt --install all
        # The docker-container builder keeps its layer cache inside its own
        # container on the long-lived dind sidecar, so it must be REUSED
        # between runs - the old rm-then-create bootstrap threw the whole
        # local cache away every run and left type=registry as the only
        # cache (aos#491). Create it only when absent (the `|| true` absorbs
        # the create race between sibling tier jobs) and recreate only when
        # the existing one genuinely fails to bootstrap.
        if ! docker buildx inspect aosbuilder >/dev/null 2>&1; then
          docker buildx create --name aosbuilder \
            --driver docker-container --driver-opt network=host || true
        fi
        if ! docker buildx inspect aosbuilder --bootstrap; then
          echo "aosbuilder exists but fails to bootstrap. Recreating it (warm cache is lost this once)"
          docker buildx rm -f aosbuilder 2>/dev/null || true
          docker buildx create --name aosbuilder \
            --driver docker-container --driver-opt network=host
          docker buildx inspect aosbuilder --bootstrap
        fi
        docker buildx use aosbuilder
        echo "buildx after bootstrap"
        docker buildx ls

    - name: Publish or promote the tier
      if: ${{ steps.checkpoint.outputs.skip_publish != 'true' }}
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        TIER: ${{ inputs.tier }}
        TAG: ${{ inputs.tag }}
        ALIAS: ${{ inputs.alias }}
        EXTRA_ALIASES: ${{ inputs.extra-aliases }}
        SOURCE_TAG: ${{ inputs.source-tag }}
        IMAGE_BASE: ${{ inputs.image-base }}
        PLATFORMS: ${{ inputs.platforms }}
        BUILD_TIMEOUT: ${{ inputs.build-timeout }}
      run: |
        set -euo pipefail
        alias_args=()
        for alias in ${ALIAS:-} ${EXTRA_ALIASES:-}; do
          [ -n "${alias}" ] && alias_args+=(--alias "${alias}")
        done
        base_args=(
          uv run python scripts/dev-base-build.py
          --registry "${IMAGE_BASE}"
          --tag "${TAG}"
          "${alias_args[@]}"
        )
        if [ "${MODE}" = "build" ]; then
          # The build script verifies the pushed tag + alias manifests and
          # probes the buildcache write after the push, so a green step means
          # the tier is pullable and the cache state is visible in the log.
          timeout --preserve-status --kill-after=5m "${BUILD_TIMEOUT}" \
            "${base_args[@]}" \
            build \
            --push \
            --tier "${TIER}" \
            --platforms "${PLATFORMS}"
        elif [ "${MODE}" = "promote" ]; then
          if [ -z "${SOURCE_TAG:-}" ]; then
            echo "::error::source-tag is required in promote mode" >&2
            exit 1
          fi
          timeout --preserve-status --kill-after=5m "${BUILD_TIMEOUT}" \
            "${base_args[@]}" \
            promote \
            --source-tag "${SOURCE_TAG}" \
            --tier "${TIER}"
        else
          echo "::error::unknown mode: ${MODE}" >&2
          exit 1
        fi
